<!doctype html>

<head>

  /* Просмотрщик: тёмная полоса сверху + сцена. ПК — макет на всю ширину, Телефон — макет в рамке 390×844 */

  .seg button[aria-pressed="true"]:hover{color:var(--bar)}
  .seg button:focus-visible{outline:2px solid #FFAE2B;outline-offset:2px}
  .seg svg{width:15px;height:15px}

  #stage{flex:1;min-height:0;position:relative}
  #frameWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:40px}
  iframe{border:0;display:block;background:#fff}
  .pc iframe{width:100%;height:100%}
  .pc aside{display:none}
  .mob #frameWrap{padding:20px}
  .phone{flex:0 0 auto;width:414px;height:900px;border-radius:54px;background:#111;padding:44px 12px 12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);position:relative;transform-origin:center}

  .pc .phone{width:100%;height:100%;border-radius:0;padding:0;background:none;box-shadow:none;transform:none!important;margin:0!important}
  .pc .phone::before{display:none}
  .mob iframe{width:390px;height:844px;border-radius:6px 6px 42px 42px}
  aside{max-width:300px;align-self:center}

  aside li{margin:6px 0}
  @media (max-width:980px){aside{display:none}}
</style>

<!--DESIGNS:START--><script>const DESIGNS={"v1-zona.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>English Zone — курсы английского в Бишкеке<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap\">\n<style>\n/* ===== Вариант 1 «Зона» — фирменный чёрно-белый стиль: след-ступня, разрядка букв,\n   жёлто-чёрная лента «границы зоны». Следы переходят черту — за ней говорят только по-английски ===== */\n:root{\n  --ink:#000;--paper:#fff;--grey:#F2F2F0;--line:#DCDCD8;--muted:#666660;--tape:#FFD60A;\n  --h:\"Unbounded\",system-ui,sans-serif;--b:\"Onest\",system-ui,\"Segoe UI\",sans-serif;\n  --stripes:repeating-linear-gradient(-45deg,var(--tape) 0 22px,#000 22px 44px);\n  --mb-bg:#fff;--mb-fg:#000;--ph-bg:#E6E6E2;--ph-fg:#A3A39C;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:80px}\nbody{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--b);-webkit-font-smoothing:antialiased}\na{color:inherit}\nsvg{display:block}\n.wrap{width:min(1180px,100% - 40px);margin-inline:auto}\n:focus-visible{outline:3px solid #000;outline-offset:3px;box-shadow:0 0 0 6px var(--tape);border-radius:6px}\nh1,h2,h3{font-family:var(--h);font-weight:700;margin:0;line-height:1.12}\nh2{font-size:clamp(26px,3vw,38px)}\n.lead{color:var(--muted);font-size:17px;max-width:52ch;margin:16px 0 0}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:12px;padding:14px 20px;font:600 15.5px/1 var(--b);text-decoration:none;cursor:pointer;white-space:nowrap}\n.btn svg{width:19px;height:19px}\n.btn-wa{background:#25D366;color:#fff}\n.btn-blk{background:#000;color:#fff}\n.btn-tape{background:var(--tape);color:#000}\n.btn-gis{background:#2FB540;color:#fff}\n.btn-out{background:#fff;color:#000;box-shadow:inset 0 0 0 2px #000}\n.btn:hover{filter:brightness(.93)}\n\n/* шапка */\nheader{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid #000}\n.hd{display:flex;align-items:center;gap:22px;height:68px}\n.logo{display:flex;align-items:center;gap:11px;text-decoration:none}\n.logo .dot{width:40px;height:40px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center}\n.logo .dot svg{width:15px;height:20px}\n.logo b{font:700 13px/1 var(--h);letter-spacing:.42em}\n.logo small{display:block;font:500 11.5px/1.2 var(--b);color:var(--muted);letter-spacing:0;margin-top:4px}\n.nav{display:flex;gap:18px;margin-left:8px}\n.nav a{text-decoration:none;font-weight:500;font-size:14.5px}\n.nav a:hover{text-decoration:underline;text-decoration-color:var(--tape);text-decoration-thickness:4px;text-underline-offset:4px}\n.hd-r{margin-left:auto;display:flex;align-items:center;gap:10px}\n.tel{font-weight:700;font-size:16.5px;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:7px}\n.tel svg{width:17px;height:17px}\n.hd .btn{padding:10px 14px;font-size:14px;border-radius:10px}\n.lang{display:flex;border:2px solid #000;border-radius:10px;overflow:hidden}\n.lang button{border:0;background:#fff;font:700 12.5px var(--b);padding:6px 9px;cursor:pointer;color:#000}\n.lang button[aria-pressed=\"true\"]{background:#000;color:#fff}\n\n/* ===== Герой: граница зоны ===== */\n.hero{display:grid;grid-template-columns:1fr 56px 1fr;min-height:min(600px,calc(100vh - 112px));border-bottom:2px solid #000;position:relative;overflow:hidden}\n.side{padding:72px max(32px,calc((100vw - 1180px)/2)) 64px 40px;display:flex;flex-direction:column;justify-content:center}\n.side.ru{padding-left:max(20px,calc((100vw - 1180px)/2));padding-right:44px}\n.side.en{background:#000;color:#fff;padding-left:52px}\n.side .tag{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:18px}\n.side .tag i{width:10px;height:10px;border-radius:50%;background:var(--line)}\n.side.en .tag{color:#9a9a94}\n.side.en .tag i{background:var(--tape)}\n.ru h1{font-size:clamp(30px,3.4vw,46px);line-height:1.1}\n.ru .sub{font-size:18px;margin:18px 0 0;max-width:42ch;color:#333}\n.ru .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}\n.facts{display:flex;gap:40px;margin:40px 0 0;padding:0;list-style:none;flex-wrap:wrap}\n.facts li{font-size:14.5px;color:var(--muted)}\n.facts b{display:block;color:#000;font:700 20px/1.1 var(--h);margin-bottom:3px}\n.sign{font:700 clamp(30px,3.7vw,52px)/1.08 var(--h);letter-spacing:.07em;text-transform:uppercase}\n.fine{margin-top:20px;font-size:17px;color:#cfcfca;max-width:34ch}\n.fine b{color:var(--tape);font-weight:600}\n.en .rule{display:flex;align-items:center;gap:12px;margin-top:28px;font-size:15px;color:#cfcfca}\n.en .rule svg{width:22px;height:22px;color:var(--tape);flex:0 0 auto}\n.tapev{background:var(--stripes);border-inline:2px solid #000;position:relative}\n.tapev span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;background:#000;color:var(--tape);font:700 13px/1 var(--h);letter-spacing:.3em;padding:8px 14px}\n/* следы, которые переходят границу */\n.steps{position:absolute;inset:0;pointer-events:none}\n.steps .fp{position:absolute;width:30px;height:40px;opacity:0}\n.steps .fp svg{width:100%;height:100%}\n.steps .fp.r{color:#C9C9C3}\n.steps .fp.e{color:#fff}\n@media (prefers-reduced-motion:no-preference){\n  .steps .fp{animation:fp .45s ease-out forwards}\n  @keyframes fp{from{opacity:0;transform:var(--t) scale(.6)}to{opacity:1;transform:var(--t)}}\n}\n@media (prefers-reduced-motion:reduce){.steps .fp{opacity:1;transform:var(--t)}}\n\n/* секции */\n.sec{padding:104px 0}\n.sec.g{background:var(--grey)}\n.sec.blk{background:#000;color:#fff}\n.sec.blk .lead{color:#bdbdb7}\n.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:48px}\n.mark{display:flex;align-items:center;gap:14px}\n.mark .ic{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--tape);color:#000;display:grid;place-items:center;border:2px solid #000}\n.mark .ic svg{width:22px;height:22px}\n\n/* правила + копилка */\n.rules{display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:stretch}\n.rl{list-style:none;margin:32px 0 0;padding:0;display:grid;gap:16px;counter-reset:r}\n.rl li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:#fff;border:2px solid #000;border-radius:16px;padding:18px 20px;counter-increment:r}\n.rl li::before{content:counter(r);width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font:700 16px var(--h)}\n.rl li b{display:block;font-size:17px}\n.rl li span{color:var(--muted);font-size:15px}\n.jar{background:#000;color:#fff;border-radius:24px;padding:36px;display:grid;grid-template-columns:1fr 170px;gap:22px;position:relative;overflow:hidden}\n.jar h3{font-size:22px;line-height:1.2}\n.jar p{color:#bdbdb7;margin:8px 0 16px;font-size:15px}\n.jar label{font-size:13.5px;color:#bdbdb7;display:block;margin-bottom:6px}\n.jar textarea{width:100%;resize:none;height:84px;border-radius:14px;border:0;padding:12px 14px;font:500 17px/1.4 var(--b);background:#1d1d1d;color:#fff}\n.jar textarea:focus{outline:2px solid var(--tape)}\n.words{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;min-height:34px}\n.words span{padding:5px 10px;border-radius:9px;background:#1d1d1d;font-size:14.5px}\n.words span.ru{background:var(--tape);color:#000;text-decoration:line-through;text-decoration-thickness:2px}\n.fineout{margin-top:14px;font:700 20px/1.2 var(--h)}\n.fineout small{display:block;font:400 13.5px var(--b);color:#bdbdb7;margin-top:6px}\n.jar-svg{align-self:end;width:170px;height:220px}\n.total{position:absolute;right:28px;top:24px;font-size:12.5px;color:#bdbdb7;text-align:right}\n.total b{display:block;color:var(--tape);font:700 18px var(--h)}\n\n/* расписание */\n.board{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}\n.bd{border:2px solid #000;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:#fff}\n.bd .top{padding:22px 24px;background:#000;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}\n.bd:nth-child(2) .top{background:var(--tape);color:#000}\n.bd .top b{font:700 22px/1 var(--h)}\n.bd .top small{display:block;font-size:13.5px;opacity:.75;margin-top:7px}\n.bd .top svg{width:22px;height:22px;flex:0 0 auto}\n.bd ul{list-style:none;margin:0;padding:12px 24px 8px;display:grid}\n.bd li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:13px 0;font-size:15.5px}\n.bd li:last-child{border:0}\n.bd li span{color:var(--muted);white-space:nowrap}\n.bd .btn{margin:8px 24px 24px;align-self:flex-start;padding:11px 15px;font-size:14px}\n.note{display:flex;gap:10px;align-items:center;margin-top:24px;color:var(--muted);font-size:15px}\n.note svg{width:20px;height:20px;color:#000}\n.seasons{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}\n.ss{border-top:2px solid #000;padding:20px 0 0;display:flex;gap:14px;align-items:center}\n.ss .m{flex:0 0 auto;font:700 13px var(--h);background:#000;color:#fff;border-radius:10px;padding:9px 10px;min-width:56px;text-align:center}\n.ss.kids .m{background:#fff;color:#000;box-shadow:inset 0 0 0 2px #000;display:flex;gap:6px;align-items:center}\n.ss.kids .m svg{width:14px;height:19px}\n.ss b{display:block;font-size:16.5px}\n.ss span{color:var(--muted);font-size:14.5px}\n\n/* цены */\n.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}\n.pr{border:2px solid #000;border-radius:20px;padding:28px;background:#fff;display:flex;flex-direction:column}\n.pr h3{font:600 17px/1.3 var(--b)}\n.pr .sum{font:700 30px/1 var(--h);margin:16px 0 4px}\n.pr .sum small{font:500 14px var(--b);color:var(--muted)}\n.pr ul{list-style:none;padding:0;margin:18px 0 24px;display:grid;gap:10px;font-size:14.5px;color:#333}\n.pr li{display:flex;gap:8px}\n.pr li svg{flex:0 0 16px;width:16px;height:16px;margin-top:3px}\n.pr .btn{margin-top:auto}\n.pr.hot{background:#000;color:#fff}\n.pr.hot ul{color:#ddd}\n.pr.hot .sum small{color:#aaa}\n.pr.hot .flag{align-self:flex-start;background:var(--tape);color:#000;font-weight:700;font-size:12.5px;border-radius:8px;padding:4px 8px;margin-bottom:10px}\n.trial{margin-top:32px;border:2px solid #000;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:22px 1fr}\n.trial .st{background:var(--stripes);border-right:2px solid #000}\n.trial div.in{padding:22px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#fff}\n.trial b{font:700 19px var(--h)}\n.trial span{color:var(--muted);flex:1;min-width:220px}\n\n/* тест */\n.test{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:center}\n.test-l ul{list-style:none;padding:0;margin:32px 0 0;display:grid;gap:14px}\n.test-l li{display:flex;gap:10px;align-items:center;font-weight:500}\n.test-l li svg{width:20px;height:20px;color:var(--tape)}\n#qcard{background:#fff;color:#000;border-radius:24px;padding:36px;min-height:430px;--qa:#000;--qopt:var(--grey);--qh:var(--h);--qtrack:#E2E2DE;--qnext:#FFF6C2;--qr:12px}\n\n/* команда */\n.team{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}\n.tm-c{border:2px solid #000;border-radius:20px;overflow:hidden;background:#fff}\n.tm-c .ph{aspect-ratio:4/4.2;border-bottom:2px solid #000;filter:grayscale(1)}\n.tm-c .t{padding:18px 20px 20px}\n.tm-c b{display:block;font:700 16px var(--h)}\n.tm-c span{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:4px}\n.tm-c em{display:inline-block;font-style:normal;font-size:12.5px;font-weight:700;background:var(--tape);border-radius:7px;padding:3px 8px;margin-top:9px}\n\n/* отзывы */\n.rv{display:grid;grid-template-columns:repeat(3,1fr) 240px;gap:24px;align-items:stretch}\n.q{border:2px solid #000;border-radius:20px;padding:28px;display:flex;flex-direction:column;background:#fff}\n.q:nth-child(2){background:#000;color:#fff}\n.q::before{content:\"“\";font:700 64px/.7 var(--h);color:var(--tape);-webkit-text-stroke:2px #000;margin-bottom:10px}\n.q p{margin:0 0 18px;font-size:16.5px;line-height:1.5}\n.q .w{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:14.5px}\n.q .w i{width:36px;height:36px;border-radius:50%;background:var(--tape);color:#000;display:grid;place-items:center;font:700 14px var(--h);font-style:normal}\n.q .w small{display:block;opacity:.65}\n.score{border-radius:20px;background:var(--tape);border:2px solid #000;padding:28px;display:flex;flex-direction:column;gap:8px}\n.score b{font:700 52px/1 var(--h)}\n.score .stars{display:flex;gap:2px}\n.score .stars svg{width:18px;height:18px}\n.score p{margin:0 0 10px;font-size:14.5px}\n.score .btn{margin-top:auto;padding:11px 12px;font-size:14px}\n.rv-more{display:flex;justify-content:flex-end;margin-top:24px}\n.rv-more a{font-weight:600;font-size:15px}\n\n/* филиалы + контакты */\n.br{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}\n.bc{border:2px solid #000;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;background:#fff}\n.bc.main{background:var(--tape)}\n.bc h3{font-size:15px;letter-spacing:.12em;display:flex;align-items:center;gap:10px}\n.bc h3 svg{width:15px;height:20px}\n.bc .ad{font-size:15.5px}\n.bc .row{display:flex;gap:8px;margin-top:auto}\n.bc .row .btn{padding:11px 14px;font-size:14px;flex:1}\n.contact{margin-top:32px;background:#000;color:#fff;border-radius:22px;padding:32px 36px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}\n.contact .ph-big{font:700 clamp(24px,2.6vw,34px)/1 var(--h);text-decoration:none;color:var(--tape)}\n.contact .hrs{display:flex;align-items:center;gap:9px;color:#ccc}\n.contact .hrs svg{width:20px;height:20px}\n.contact .row{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}\nfooter{padding:40px 0 48px;border-top:2px solid #000;color:var(--muted);font-size:13.5px}\nfooter .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n\n/* ===== планшет / телефон ===== */\n@media (max-width:1100px){\n  .nav{display:none}\n  .prices{grid-template-columns:1fr 1fr}\n  .team{grid-template-columns:repeat(3,1fr)}\n  .rv{grid-template-columns:1fr 1fr}\n}\n@media (max-width:760px){\n  html{scroll-padding-top:70px}\n  .wrap{width:calc(100% - 32px)}\n  .hd{height:60px;gap:8px}\n  .logo{gap:8px}\n  .logo .dot{width:34px;height:34px}\n  .logo b{font-size:9.5px;letter-spacing:.18em}\n  .logo small{display:none}\n  .hd-r{gap:6px}\n  .hd .btn-wa span,.hd .btn-gis{display:none}\n  .tel span{display:none}\n  .tel{width:40px;height:40px;border-radius:10px;border:2px solid #000;justify-content:center}\n  .hd .btn-wa{padding:0;width:40px;height:40px}\n  .lang button{padding:6px 7px}\n  .hero{grid-template-columns:1fr;grid-template-rows:auto 40px auto;min-height:0}\n  .side,.side.ru,.side.en{padding:40px 16px}\n  .ru h1{font-size:28px}\n  .ru .sub{font-size:16.5px}\n  .ru .cta .btn{flex:1}\n  .facts{gap:20px}\n  .facts b{font-size:17px}\n  .tapev{border-inline:0;border-block:2px solid #000;background:repeating-linear-gradient(-45deg,var(--tape) 0 16px,#000 16px 32px)}\n  .tapev span{transform:translate(-50%,-50%);font-size:11px}\n  .sign{font-size:27px}\n  .steps{display:none}\n  .sec{padding:72px 0}\n  .sh{flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:32px}\n  .mark .ic{width:44px;height:44px}\n  .rules,.test{grid-template-columns:1fr;gap:24px}\n  .jar{grid-template-columns:1fr;padding:24px}\n  .jar-svg{display:none}\n  .total{position:static;text-align:left;margin-top:6px}\n  .board,.seasons,.br{grid-template-columns:1fr}\n  .prices{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:0 16px 6px}\n  .pr{flex:0 0 78%;scroll-snap-align:start}\n  #qcard{padding:24px;min-height:0}\n  .team{display:flex;overflow-x:auto;margin-inline:-16px;padding:0 16px 6px}\n  .tm-c{flex:0 0 58%}\n  .rv{display:flex;overflow-x:auto;margin-inline:-16px;padding:0 16px 6px;scroll-snap-type:x mandatory}\n  .q,.score{flex:0 0 82%;scroll-snap-align:start}\n  .contact{padding:24px}\n  .contact .row{margin-left:0;width:100%}\n  .contact .row .btn{flex:1}\n}\n<\/style>\n<\/head>\n<body>\n<!--SWITCH:START-->\n<style>\n  .sw-bar{position:sticky;top:0;z-index:100;display:none;align-items:center;gap:12px;flex-wrap:wrap;\n    background:#141414;color:#fff;font:500 13px/1.2 system-ui,\"Segoe UI\",sans-serif;\n    padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left))}\n  body.has-sw .sw-bar{display:flex}\n  body.has-sw header{top:var(--swh,44px)}\n  .sw-bar .sw-t{font-weight:700;letter-spacing:.08em;white-space:nowrap}\n  .sw-bar .sw-t span{font-weight:400;letter-spacing:0;color:#9a9a9a;margin-left:6px}\n  .sw-bar .sw-g{display:flex;background:#2a2a2a;border-radius:9px;padding:3px}\n  .sw-bar .sw-g:first-of-type{margin-left:auto}\n  .sw-bar a{color:#cfcfcf;text-decoration:none;padding:6px 11px;border-radius:7px;white-space:nowrap}\n  .sw-bar a:hover{color:#fff}\n  .sw-bar a[aria-current=\"true\"]{background:#fff;color:#141414;font-weight:600}\n  .sw-bar a:focus-visible{outline:2px solid #FFAE2B;outline-offset:2px}\n  @media (max-width:700px){.sw-bar .sw-t{display:none}.sw-bar .sw-g:first-of-type{margin-left:0}.sw-bar .sw-g{flex:1}.sw-bar a{flex:1;text-align:center;padding:6px 4px}}\n<\/style>\n<nav class=\"sw-bar\" aria-label=\"Переключатель макетов\"><div class=\"sw-t\">ENGLISH ZONE<span>макеты сайта<\/span><\/div><div class=\"sw-g\" role=\"group\" aria-label=\"Сайт\"><a href=\"v1-zona.html\" aria-current=\"true\">1 · Зона<\/a><a href=\"v2-shagi.html\" aria-current=\"false\">2 · Шаги<\/a><a href=\"v3-sezon.html\" aria-current=\"false\">3 · Сезон<\/a><\/div><div class=\"sw-g\" role=\"group\" aria-label=\"Устройство\"><a href=\"v1-zona.html\" aria-current=\"true\">ПК<\/a><a href=\"index.html#v1-mob\" aria-current=\"false\">Телефон<\/a><\/div><\/nav>\n<script>if(window.top===window.self){document.body.classList.add(\"has-sw\");const swh=()=>{const h=document.querySelector(\".sw-bar\").offsetHeight;document.body.style.setProperty(\"--swh\",h+\"px\");document.documentElement.style.scrollPaddingTop=(h+90)+\"px\";};swh();addEventListener(\"resize\",swh);}<\/script>\n<!--SWITCH:END-->\n\n<header>\n  <div class=\"wrap hd\">\n    <a class=\"logo\" href=\"#top\" aria-label=\"English Zone — наверх\">\n      <span class=\"dot\"><svg viewBox=\"0 0 24 32\"><use href=\"#i-foot\"/><\/svg><\/span>\n      <span><b>ENGLISHZONE<\/b><small data-kg=\"Англис тили зонасы\">Зона английского языка<\/small><\/span>\n    <\/a>\n    <nav class=\"nav\" aria-label=\"Разделы\">\n      <a href=\"#schedule\" data-kg=\"Жадыбал\">Расписание<\/a>\n      <a href=\"#prices\" data-kg=\"Баалар\">Цены<\/a>\n      <a href=\"#test\" data-kg=\"Тест\">Тест<\/a>\n      <a href=\"#team\" data-kg=\"Мугалимдер\">Преподаватели<\/a>\n      <a href=\"#reviews\" data-kg=\"Пикирлер\">Отзывы<\/a>\n      <a href=\"#branches\" data-kg=\"Филиалдар\">Филиалы<\/a>\n    <\/nav>\n    <div class=\"hd-r\">\n      <a class=\"tel\" href=\"tel:+996770692299\" aria-label=\"Позвонить\"><svg><use href=\"#i-phone\"/><\/svg><span>+996 770 69 22 99<\/span><\/a>\n      <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span>WhatsApp<\/span><\/a>\n      <a class=\"btn btn-gis\" data-gis href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a>\n      <div class=\"lang\" role=\"group\" aria-label=\"Язык\"><button data-l=\"ru\">RU<\/button><button data-l=\"kg\">KG<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n<!-- ===== Герой: две стороны границы ===== -->\n<section class=\"hero\">\n  <div class=\"side ru\">\n    <div class=\"tag\"><i><\/i><span data-kg=\"Бул жакта азырынча орусча болот\">По эту сторону ещё можно по-русски<\/span><\/div>\n    <h1 data-kg=\"Чектен аттаңыз — англисче сүйлөй баштайсыз\">Переступите черту — и&nbsp;заговорите по&#8209;английски<\/h1>\n    <p class=\"sub\" data-kg=\"Бишкектеги англис тили курстары: балдар, өспүрүмдөр, чоңдор жана IELTS. Сабакта — англисче гана, биринчи күндөн.\">Курсы английского в Бишкеке для детей, подростков, взрослых и IELTS. На уроке — только английский, с первого дня.<\/p>\n    <div class=\"cta\">\n      <a class=\"btn btn-blk\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Сынамык сабакка жазылуу\">Записаться на пробный урок<\/span><\/a>\n      <a class=\"btn btn-out\" href=\"#test\"><svg><use href=\"#i-q\"/><\/svg><span data-kg=\"Деңгээлди билүү\">Узнать свой уровень<\/span><\/a>\n    <\/div>\n    <ul class=\"facts\">\n      <li><b>3<\/b><span data-kg=\"филиал Бишкекте\">филиала в Бишкеке<\/span><\/li>\n      <li><b>6–8<\/b><span data-kg=\"адам топто\">человек в группе<\/span><\/li>\n      <li><b>9:10–21:30<\/b><span data-kg=\"ДШ–ЖМ\">ПН–ПТ<\/span><\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"tapev\" aria-hidden=\"true\"><span>ENGLISH ZONE<\/span><\/div>\n  <div class=\"side en\">\n    <div class=\"tag\"><i><\/i><span data-kg=\"Бул жакта — англисче гана\">А здесь — только английский<\/span><\/div>\n    <div class=\"sign\" lang=\"en\">We speak only English here!<\/div>\n    <p class=\"fine\" lang=\"en\">10 som per non-English word <b>(goes to charity)<\/b><\/p>\n    <div class=\"rule\"><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Ушул эреженин аркасында окуучулар 2–3 айдан кийин сүйлөй башташат.\">Из-за этого правила студенты начинают говорить через 2–3 месяца.<\/span><\/div>\n  <\/div>\n  <div class=\"steps\" id=\"steps\" aria-hidden=\"true\"><\/div>\n<\/section>\n\n<!-- ===== Правила + копилка ===== -->\n<section class=\"sec g\" id=\"rules\">\n  <div class=\"wrap rules\">\n    <div>\n      <div class=\"mark\"><span class=\"ic\"><svg><use href=\"#i-check\"/><\/svg><\/span><h2 data-kg=\"Зонанын эрежелери\">Правила зоны<\/h2><\/div>\n      <p class=\"lead\" data-kg=\"Мээ которууну токтотуп, англисче ойлоно баштайт. Үч гана эреже.\">Мозг перестаёт переводить и начинает думать по-английски. Правил всего три.<\/p>\n      <ol class=\"rl\">\n        <li><div><b data-kg=\"Эшиктен кирдиңизби — англисче сүйлөйсүз\">Зашли в дверь — говорите по-английски<\/b><span data-kg=\"Ресепшнде, коридордо, тыныгууда да.\">На ресепшене, в коридоре и на перемене тоже.<\/span><\/div><\/li>\n        <li><div><b data-kg=\"Орусча сөз — 10 сом копилкага\">Русское слово — 10 сом в копилку<\/b><span data-kg=\"Акча толугу менен кайрымдуулукка кетет.\">Все деньги уходят на благотворительность.<\/span><\/div><\/li>\n        <li><div><b data-kg=\"Ката кетирүү — кадыресе нерсе\">Ошибаться — нормально<\/b><span data-kg=\"Мугалим токтотпойт, сабактан кийин оңдойт.\">Преподаватель не перебивает, а поправляет после.<\/span><\/div><\/li>\n      <\/ol>\n    <\/div>\n    <div class=\"jar\" aria-live=\"polite\">\n      <div>\n        <h3 data-kg=\"Копилкага канча кетет?\">Сколько уйдёт в копилку?<\/h3>\n        <p data-kg=\"Сабактагыдай фраза жазыңыз — орусча сөздөрдү эсептейбиз.\">Напишите фразу, как на уроке — посчитаем русские слова.<\/p>\n        <label for=\"jarIn\" data-kg=\"Сиздин фраза\">Ваша фраза<\/label>\n        <textarea id=\"jarIn\" spellcheck=\"false\">Teacher, можно I go to туалет, пожалуйста?<\/textarea>\n        <div class=\"words\" id=\"jarWords\"><\/div>\n        <div class=\"fineout\" id=\"jarFine\"><\/div>\n      <\/div>\n      <svg class=\"jar-svg\" viewBox=\"0 0 170 220\" aria-hidden=\"true\">\n        <rect x=\"52\" y=\"8\" width=\"66\" height=\"18\" rx=\"5\" fill=\"#2a2a2a\"/>\n        <path d=\"M44 34h82c10 0 16 8 16 18v134c0 14-10 26-26 26H54c-16 0-26-12-26-26V52c0-10 6-18 16-18z\" fill=\"none\" stroke=\"#5a5a5a\" stroke-width=\"3\"/>\n        <g id=\"coins\"><\/g>\n        <text x=\"85\" y=\"128\" text-anchor=\"middle\" fill=\"#5a5a5a\" font-family=\"Unbounded\" font-size=\"11\" font-weight=\"700\">CHARITY<\/text>\n      <\/svg>\n      <div class=\"total\"><span data-kg=\"2025-жылы чогулду*\">Собрано в 2025*<\/span><b>48 270 сом<\/b><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Расписание ===== -->\n<section class=\"sec\" id=\"schedule\">\n  <div class=\"wrap\">\n    <div class=\"sh\">\n      <div class=\"mark\"><span class=\"ic\"><svg><use href=\"#i-cal\"/><\/svg><\/span><h2 data-kg=\"Жадыбал\">Расписание<\/h2><\/div>\n      <p class=\"lead\" style=\"margin:0\" data-kg=\"Топтор ДШ·ШР·ЖМ же ШЕ·БШ. Сабак — 90 мүнөт, топто 6–8 адам.\">Группы ПН·СР·ПТ или ВТ·ЧТ. Урок — 90 минут, в группе 6–8 человек.<\/p>\n    <\/div>\n    <div class=\"board\">\n      <article class=\"bd\">\n        <div class=\"top\"><div><b data-kg=\"Эртең\">Утро<\/b><small data-kg=\"9:10–13:00 · студенттер, эркин график\">9:10–13:00 · студенты, свободный график<\/small><\/div><svg><use href=\"#i-clock\"/><\/svg><\/div>\n        <ul>\n          <li>Beginner<span data-kg=\"ДШ·ШР·ЖМ 9:10\">ПН·СР·ПТ 9:10<\/span><\/li>\n          <li>Pre-Intermediate<span data-kg=\"ДШ·ШР·ЖМ 11:00\">ПН·СР·ПТ 11:00<\/span><\/li>\n          <li>Intermediate<span data-kg=\"ШЕ·БШ 10:00\">ВТ·ЧТ 10:00<\/span><\/li>\n        <\/ul>\n        <a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Хочу в утреннюю группу. Какие есть места?\" data-wa-kg=\"Саламатсызбы! Эртең мененки топко жазылгым келет. Орун барбы?\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Орун сурап билүү\">Узнать про места<\/span><\/a>\n      <\/article>\n      <article class=\"bd\">\n        <div class=\"top\"><div><b data-kg=\"Күндүз\">День<\/b><small data-kg=\"14:00–18:00 · балдар жана өспүрүмдөр\">14:00–18:00 · дети и подростки<\/small><\/div><svg><use href=\"#i-users\"/><\/svg><\/div>\n        <ul>\n          <li>Kids 7–10<span data-kg=\"ДШ·ШР·ЖМ 14:00\">ПН·СР·ПТ 14:00<\/span><\/li>\n          <li>Kids 10–13<span data-kg=\"ШЕ·БШ 15:30\">ВТ·ЧТ 15:30<\/span><\/li>\n          <li>Teens 13–16<span data-kg=\"ДШ·ШР·ЖМ 16:30\">ПН·СР·ПТ 16:30<\/span><\/li>\n        <\/ul>\n        <a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Хочу записать ребёнка в дневную группу. Ребёнку ... лет.\" data-wa-kg=\"Саламатсызбы! Баламды күндүзгү топко жазгым келет. Балам ... жашта.\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Баланы жазуу\">Записать ребёнка<\/span><\/a>\n      <\/article>\n      <article class=\"bd\">\n        <div class=\"top\"><div><b data-kg=\"Кеч\">Вечер<\/b><small data-kg=\"18:30–21:30 · иштегендер үчүн\">18:30–21:30 · для работающих<\/small><\/div><svg><use href=\"#i-laptop\"/><\/svg><\/div>\n        <ul>\n          <li>Elementary<span data-kg=\"ШЕ·БШ 19:00\">ВТ·ЧТ 19:00<\/span><\/li>\n          <li>Intermediate<span data-kg=\"ДШ·ШР·ЖМ 20:00\">ПН·СР·ПТ 20:00<\/span><\/li>\n          <li>IELTS 7.0+<span data-kg=\"ДШ·ШР·ЖМ 18:30\">ПН·СР·ПТ 18:30<\/span><\/li>\n        <\/ul>\n        <a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Хочу в вечернюю группу. Какие есть места?\" data-wa-kg=\"Саламатсызбы! Кечки топко жазылгым келет. Орун барбы?\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Орун сурап билүү\">Узнать про места<\/span><\/a>\n      <\/article>\n    <\/div>\n    <p class=\"note\"><svg><use href=\"#i-pin\"/><\/svg><span data-kg=\"Жадыбал үч филиалда тең бирдей. Speaking Club — жума сайын, 19:30.\">Расписание одинаковое во всех трёх филиалах. Speaking Club — по пятницам в 19:30.<\/span><\/p>\n    <div class=\"seasons\" id=\"seasons\">\n      <div class=\"ss\"><span class=\"m\" data-kg=\"Сен\">Сен<\/span><div><b data-kg=\"Күзгү топтор\">Осенний набор<\/b><span data-kg=\"8 ай, бардык деңгээлдер\">8 месяцев, все уровни<\/span><\/div><\/div>\n      <div class=\"ss\"><span class=\"m\" data-kg=\"Янв\">Янв<\/span><div><b data-kg=\"Кышкы топтор\">Зимний набор<\/b><span data-kg=\"жайга чейин\">до лета<\/span><\/div><\/div>\n      <div class=\"ss kids\"><span class=\"m\"><svg viewBox=\"0 0 24 32\"><defs><linearGradient id=\"rbw\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"> галим жана топ менен тааныштырабыз.\">Определим уровень, познакомим с преподавателем и группой.<\/span><a class=\"btn btn-blk\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Жазылуу\">Записаться<\/span><\/a><\/div><\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Тест ===== -->\n<section class=\"sec blk\" id=\"test\">\n  <div class=\"wrap test\">\n    <div class=\"test-l\">\n      <div class=\"mark\"><span class=\"ic\"><svg><use href=\"#i-q\"/><\/svg><\/span><h2 data-kg=\"Деңгээлиңизди 2 мүнөттө билиңиз\">Узнайте уровень за 2 минуты<\/h2><\/div>\n      <p class=\"lead\" data-kg=\"10 суроо — жөнөкөйдөн татаалга. Аягында деңгээл жана ылайыктуу топ.\">10 вопросов — от простых к сложным. В конце покажем уровень и подходящую группу.<\/p>\n      <ul>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Каттоосуз\">Без регистрации<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Жыйынтыкты WhatsAppка жөнөтсө болот\">Результат можно отправить в WhatsApp<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Сынамык сабакта деңгээлди тактайбыз\">Точный уровень уточним на пробном уроке<\/span><\/li>\n      <\/ul>\n    <\/div>\n    <div id=\"qcard\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Команда ===== -->\n<section class=\"sec\" id=\"team\">\n  <div class=\"wrap\">\n    <div class=\"sh\">\n      <div class=\"mark\"><span class=\"ic\"><svg><use href=\"#i-users\"/><\/svg><\/span><h2 data-kg=\"Мугалимдер\">Преподаватели<\/h2><\/div>\n      <p class=\"lead\" style=\"margin:0\" data-kg=\"Ар бири эл аралык сертификат менен. Сабакта бир да орусча сөз жок.\">Все с международными сертификатами. И да — на уроке ни слова по-русски.<\/p>\n    <\/div>\n    <div class=\"team\">\n      <div class=\"tm-c\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Айжан\">Айжан<\/b><span data-kg=\"Башкы мугалим, IELTS\">Head teacher, IELTS<\/span><em>IELTS 8.0<\/em><\/div><\/div>\n      <div class=\"tm-c\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Тимур\">Тимур<\/b><span data-kg=\"Чоңдор, Speaking Club\">Взрослые, Speaking Club<\/span><em>CELTA<\/em><\/div><\/div>\n      <div class=\"tm-c\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Мээрим\">Мээрим<\/b><span data-kg=\"Балдар 7–13, Kids Camp\">Дети 7–13, Kids Camp<\/span><em>TKT<\/em><\/div><\/div>\n      <div class=\"tm-c\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Дастан\">Дастан<\/b><span data-kg=\"Грамматика, Intermediate+\">Грамматика, Intermediate+<\/span><em>IELTS 7.5<\/em><\/div><\/div>\n      <div class=\"tm-c\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Камила\">Камила<\/b><span data-kg=\"Нөлдөн баштагандар, өспүрүмдөр\">С нуля, подростки<\/span><em>TESOL<\/em><\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ===== Отзывы ===== -->\n<section class=\"sec g\" id=\"reviews\">\n  <div class=\"wrap\">\n    <div class=\"sh\">\n      <div class=\"mark\"><span class=\"ic\"><svg><use href=\"#i-star\"/><\/svg><\/span><h2 data-kg=\"Окуучулардын пикирлери\">Отзывы студентов<\/h2><\/div>\n      <p class=\"lead\" style=\"margin:0\" data-kg=\"Зонага киргенге чейин жана киргенден кийин.\">Что было до зоны — и что стало после.<\/p>\n    <\/div>\n    <div class=\"rv\">\n      <div class=\"q\"><p data-kg=\"Биринчи жумада оозумду ачканга коркчумун. Бир айдан кийин мугалим менен англисче талашып, жеңип чыктым.\">Первую неделю было страшно открыть рот. Через месяц я спорила с преподавателем по-английски — и выиграла.<\/p><div class=\"w\"><i>А<\/i><span>Алина<small>Intermediate, 4 мес<\/small><\/span><\/div><\/div>\n      <div class=\"q\"><p data-kg=\"10 сом эрежеси эң мыкты мотивация. Биринчи жумада 200 сом бердим, а гээлим — \"+r.n+\". Сынамык сабакка жазылгым келет.\")\n                 :(\"Здравствуйте! Прошёл(а) тест на сайте: \"+sc+\" из 10, уровень \"+r.n+\". Хочу записаться на пробный урок.\");\n        el.innerHTML=prog+'<div class=\"qt-res\"><span class=\"qt-n\">'+(kg?\"Сиздин болжолдуу деңгээлиңиз\":\"Ваш примерный уровень\")+'<\/span>'+\n          '<div class=\"qt-lvl\">'+r.n+'<\/div>'+\n          '<div class=\"qt-dots\" role=\"img\" aria-label=\"'+sc+' / 10\">'+ans.map(function(a){return '<i class=\"'+(a?\"ok\":\"\")+'\"><\/i>';}).join(\"\")+'<\/div>'+\n          '<p><b>'+(kg?(\"Туура жооптор: \"+sc+\" / 10. \"):(\"Правильных ответов: \"+sc+\" из 10. \"))+'<\/b>'+(kg?r.kg:r.ru)+'<\/p>'+\n          '<div class=\"qt-next\"><b>'+(kg?\"Эми эмне? Жыйынтыкты жөнөтүңүз — сынамык сабакка жазабыз жана деңгээлди тактайбыз.\":\"Что дальше? Отправьте результат — запишем на пробный урок и уточним уровень.\")+'<\/b>'+\n          '<div class=\"qt-btns\"><a class=\"qt-wa\" target=\"_blank\" rel=\"noopener\" href=\"'+window.ENwaLink(wa)+'\"><svg><use href=\"#i-wa\"/><\/svg>'+(kg?\"WhatsAppка жөнөтүү\":\"Отправить в WhatsApp\")+'<\/a>'+\n          '<a class=\"qt-call\" href=\"tel:+996770692299\"><svg><use href=\"#i-phone\"/><\/svg>'+(kg?\"Чалуу\":\"Позвонить\")+'<\/a>'+\n          '<button class=\"qt-again\" type=\"button\">'+(kg?\"Кайра өтүү\":\"Пройти заново\")+'<\/button><\/div><\/div><\/div>';\n        el.querySelector(\".qt-again\").onclick=function(){qi=0;ans=[];draw();};\n        return;\n      }\n      var q=Q[qi];\n      el.innerHTML=prog+'<span class=\"qt-n\">'+(kg?\"Суроо \":\"Вопрос \")+(qi+1)+' / '+n+' · '+(kg?\"Боштукту толтуруңуз\":\"Заполните пропуск\")+'<\/span>'+\n        '<div class=\"qt-q\">'+q[0].replace(\"___\",\"<u>&nbsp;?&nbsp;<\/u>\")+'<\/div>'+\n        '<div class=\"qt-opts\">'+q[1].map(function(o,i){return '<button type=\"button\" data-i=\"'+i+'\">'+o+'<\/button>';}).join(\"\")+'<\/div>';\n      el.querySelectorAll(\".qt-opts button\").forEach(function(b){\n        b.onclick=function(){\n          if(lock)return; lock=true;\n          var ok=+b.dataset.i===q[2]; ans.push(ok);\n          el.querySelectorAll(\".qt-opts button\").forEach(function(x){x.disabled=true; if(+x.dataset.i===q[2])x.classList.add(\"ok\");});\n          if(!ok)b.classList.add(\"no\");\n          setTimeout(function(){lock=false;qi++;draw();},window.ENreduced?150:650);\n        };\n      });\n    }\n    draw();\n    document.addEventListener(\"enlang\",draw);\n  };\n})();\n<\/script>\n\n<!--CORE:END-->\n\n<script>\n/* ===== Следы: идут слева направо и переходят ленту-границу ===== */\n(function(){\n  var box=document.getElementById(\"steps\"); if(!box)return;\n  // x — доля ширины героя, y — от низа; чётные — левая нога\n  var P=[[.43,74],[.465,50],[.5,76],[.535,52],[.57,78],[.605,54],[.64,80]];\n  box.innerHTML=P.map(function(p,i){\n    var left=i%2===0, en=p[0]>.52;\n    var t=\"rotate(90deg)\"+(left?\" scaleX(-1)\":\"\");\n    return '<span class=\"fp '+(en?\"e\":\"r\")+'\" style=\"left:calc('+(p[0]*100)+'% - 15px);bottom:'+p[1]+'px;--t:'+t+';transform:'+t+';animation-delay:'+(0.4+i*0.32)+'s\"><svg viewBox=\"0 0 24 32\"><use href=\"#i-foot\"/><\/svg><\/span>';\n  }).join(\"\");\n})();\n\n/* ===== Копилка: считает слова кириллицей ===== */\n(function(){\n  var inp=document.getElementById(\"jarIn\"), out=document.getElementById(\"jarWords\"), fine=document.getElementById(\"jarFine\"), coins=document.getElementById(\"coins\");\n  function esc(s){return s.replace(/[&<>\"]/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c];});}\n  function run(){\n    var kg=window.ENLANG===\"kg\";\n    var w=inp.value.trim().split(/\\s+/).filter(Boolean);\n    var n=0;\n    out.innerHTML=w.map(function(x){var ru=/[а-яёңөү]/i.test(x); if(ru)n++; return '<span class=\"'+(ru?\"ru\":\"\")+'\">'+esc(x)+'<\/span>';}).join(\"\");\n    fine.innerHTML=n\n      ? (kg?(n+\" сөз × 10 сом = \"+n*10+\" сом\"):(n+\" \"+(n%10===1&&n%100!==11?\"слово\":(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?\"слова\":\"слов\")+\" × 10 сом = \"+n*10+\" сом\"))+'<small>'+(kg?\"Акча кайрымдуулукка кетет. Англисче кайра айтып көрүңүз!\":\"Деньги уйдут на благотворительность. Попробуйте сказать по-английски!\")+'<\/small>'\n      : (kg?\"0 сом — азаматсыз!\":\"0 сом — great job!\")+'<small>'+(kg?\"Бир да орусча сөз жок. Сиз биздин окуучуга окшошсуз.\":\"Ни одного русского слова. Вы уже говорите как наш студент.\")+'<\/small>';\n    var k=Math.min(n,14), html=\"\";\n    for(var i=0;i<k;i++){var x=55+((i*37)%60), y=196-Math.floor(i/3)*15-(i%3)*3; html+='<g><ellipse cx=\"'+x+'\" cy=\"'+y+'\" rx=\"15\" ry=\"6\" fill=\"#B89600\"/><ellipse cx=\"'+x+'\" cy=\"'+(y-2)+'\" rx=\"15\" ry=\"6\" fill=\"#FFD60A\" stroke=\"#000\"/><\/g>';}\n    coins.innerHTML=html;\n  }\n  inp.addEventListener(\"input\",run); document.addEventListener(\"enlang\",run); run();\n})();\n\nENtest(document.getElementById(\"qcard\"));\n<\/script>\n<\/body>\n<\/html>\n", "v2-shagi.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>English Zone — английский только на английском<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap\">\n<style>\n/* ===== Вариант 2 «Шаги» — минимализм: белый фон, одна гарнитура, один синий акцент, линии вместо карточек ===== */\n:root{\n  --ink:#111418;--muted:#6B7079;--line:#E3E5EA;--tint:#F5F6F8;--acc:#1F45FF;--acc-d:#1534CC;\n  --f:\"Geologica\",system-ui,\"Segoe UI\",sans-serif;\n  --mb-bg:#fff;--mb-fg:#111418;--ph-bg:#EEF0F3;--ph-fg:#A9AEB8;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:76px}\nbody{margin:0;background:#fff;color:var(--ink);font:300 17px/1.6 var(--f);-webkit-font-smoothing:antialiased}\na{color:inherit}\nsvg{display:block}\n.wrap{width:min(1160px,100% - 48px);margin-inline:auto}\n:focus-visible{outline:2px solid var(--acc);outline-offset:3px}\nh1,h2,h3{font-weight:500;margin:0;letter-spacing:-.02em}\nh2{font-size:clamp(28px,3.2vw,42px);line-height:1.1}\np{margin:0}\n.muted{color:var(--muted)}\n.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:15px 24px;font:500 15.5px/1 var(--f);text-decoration:none;cursor:pointer;white-space:nowrap}\n.btn svg{width:18px;height:18px}\n.btn-acc{background:var(--acc);color:#fff}\n.btn-acc:hover{background:var(--acc-d)}\n.btn-line{box-shadow:inset 0 0 0 1px var(--line);background:#fff}\n.btn-line:hover{box-shadow:inset 0 0 0 1px var(--ink)}\n.btn-wa{background:#25D366;color:#fff}\n.btn-gis{background:#2FB540;color:#fff}\n.lnk{font-weight:500;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}\n.lnk:hover{color:var(--acc)}\n\n/* шапка */\nheader{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}\n.hd{display:flex;align-items:center;gap:30px;height:66px}\n.wm{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:18px;letter-spacing:-.02em}\n.wm svg{width:14px;height:19px;color:var(--acc)}\n.nav{display:flex;gap:24px;font-size:15px}\n.nav a{text-decoration:none;color:var(--muted)}\n.nav a:hover{color:var(--ink)}\n.hd-r{margin-left:auto;display:flex;align-items:center;gap:14px}\n.tel{font-weight:500;text-decoration:none;font-size:16px;white-space:nowrap}\n.ic-b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;text-decoration:none}\n.ic-b svg{width:19px;height:19px}\n.lang{display:flex;gap:2px;font-size:13.5px}\n.lang button{border:0;background:none;font:500 13.5px var(--f);color:var(--muted);padding:6px 6px;cursor:pointer}\n.lang button[aria-pressed=\"true\"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--acc);text-decoration-thickness:2px}\n\n/* герой */\n.hero{padding:80px 0 64px;display:grid;grid-template-columns:1.15fr 1fr;gap:64px;align-items:center;min-height:calc(100vh - 66px - 120px);max-height:640px}\n.hero h1{font-size:clamp(34px,4.1vw,58px);line-height:1.02;font-weight:500;letter-spacing:-.035em}\n.hero h1 span{display:block;color:var(--muted);font-weight:300}\n.hero .sub{margin-top:28px;font-size:19px;max-width:44ch;color:#3A3F47}\n.hero .row{display:flex;align-items:center;gap:28px;margin-top:40px;flex-wrap:wrap}\n.steps{width:100%;max-width:560px;justify-self:end;color:var(--acc)}\n.steps .stair{fill:none;stroke:var(--line);stroke-width:2}\n.steps .lbl{font:400 15px var(--f);fill:var(--muted)}\n.steps .lbl.top{fill:var(--ink);font-weight:500}\n.steps .fp{opacity:0}\n@media (prefers-reduced-motion:no-preference){\n  .steps .fp{animation:walk 9s infinite}\n  @keyframes walk{0%{opacity:0;transform:translateY(6px)}4%{opacity:1;transform:none}78%{opacity:1}88%,100%{opacity:0}}\n}\n@media (prefers-reduced-motion:reduce){.steps .fp{opacity:1}}\n\n/* полоса фактов */\n.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.facts div{padding:32px 32px 32px 0}\n.facts div+div{padding-left:32px;border-left:1px solid var(--line)}\n.facts b{display:block;font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.1}\n.facts span{color:var(--muted);font-size:15px}\n\n/* секции */\n.sec{padding:112px 0}\n.sec.tint{background:var(--tint)}\n.sh{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:end;margin-bottom:56px}\n.sh .k{display:flex;align-items:center;gap:12px;color:var(--acc);font-weight:500;font-size:15px;margin-bottom:20px}\n.sh .k svg{width:20px;height:20px}\n.sh p{color:var(--muted);max-width:46ch}\n\n/* расписание */\n.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}\n.tabs button{border:0;background:none;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:10px 18px;font:400 15px var(--f);cursor:pointer;color:var(--ink)}\n.tabs button[aria-pressed=\"true\"]{background:var(--ink);color:#fff;box-shadow:none}\n.tbl{width:100%;border-collapse:collapse}\n.tbl th{font-weight:400;font-size:13.5px;color:var(--muted);text-align:left;padding:0 0 10px;border-bottom:1px solid var(--ink)}\n.tbl td{padding:16px 0;border-bottom:1px solid var(--line);font-size:17px;vertical-align:middle}\n.tbl td:first-child{font-weight:500}\n.tbl td:last-child{text-align:right}\n.tbl tr[hidden]{display:none}\n.tbl .seat{font-size:14px;color:var(--muted)}\n.tbl .seat.few{color:#C2410C}\n.season{display:flex;gap:64px;margin-top:48px;flex-wrap:wrap}\n.season div{display:flex;gap:14px;align-items:baseline}\n.season b{font-weight:500;font-size:22px;color:var(--acc);min-width:46px}\n.season span{color:var(--muted);font-size:15px}\n.season strong{display:block;font-weight:500;color:var(--ink);font-size:16px}\n\n/* цены */\n.prices{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}\n.pr{padding:32px 32px 8px 0;display:flex;flex-direction:column;gap:8px}\n.pr+.pr{padding-left:32px;border-left:1px solid var(--line)}\n.pr h3{font-weight:400;font-size:16px;color:var(--muted)}\n.pr .sum{font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin-top:8px}\n.pr .sum small{font-size:15px;font-weight:300;color:var(--muted);letter-spacing:0}\n.pr p{font-size:15px;color:#3A3F47;margin:8px 0 18px}\n.pr .lnk{margin-top:auto;align-self:flex-start}\n.free{margin-top:48px;display:flex;align-items:center;gap:32px;flex-wrap:wrap;padding:32px 0 0;border-top:1px solid var(--line)}\n.free b{font-weight:500;font-size:22px}\n.free span{color:var(--muted);flex:1;min-width:240px}\n\n/* тест */\n.test{display:grid;grid-template-columns:.75fr 1.25fr;gap:96px;align-items:start}\n.test ol{margin:36px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:20px}\n.test ol li{counter-increment:s;display:flex;gap:14px;color:#3A3F47}\n.test ol li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc);display:grid;place-items:center;font-size:13px;font-weight:500}\n#qcard{border-top:1px solid var(--ink);padding-top:28px;min-height:430px;--qa:var(--acc);--qopt:var(--tint);--qtrack:var(--line);--qnext:var(--tint);--qr:999px}\n#qcard .qt-opts button{font-weight:400}\n#qcard .qt-q{font-weight:500}\n#qcard .qt-next{border-radius:20px}\n\n/* команда — список */\n.team{border-top:1px solid var(--ink)}\n.tr{display:grid;grid-template-columns:56px 1.1fr 1.6fr auto;gap:32px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}\n.tr .ph{width:56px;height:56px;border-radius:50%}\n.tr b{font-weight:500;font-size:19px}\n.tr span{color:#3A3F47}\n.tr em{font-style:normal;font-size:14px;color:var(--acc);box-shadow:inset 0 0 0 1px currentColor;border-radius:999px;padding:5px 12px;white-space:nowrap}\n\n/* отзывы */\n.rv{display:grid;grid-template-columns:1fr 280px;gap:96px;align-items:end}\n.rv blockquote{margin:0;font-size:clamp(24px,2.8vw,36px);line-height:1.3;font-weight:300;letter-spacing:-.015em;min-height:3.9em}\n.rv blockquote::before{content:\"“\";display:block;color:var(--acc);font-size:80px;line-height:.6;font-weight:500;margin-bottom:10px}\n.rv .who{display:flex;align-items:center;gap:16px;margin-top:36px}\n.rv .who .ph{width:48px;height:48px;border-radius:50%}\n.rv .who b{font-weight:500;display:block}\n.rv .who small{color:var(--muted);font-size:14.5px}\n.rv-nav{display:flex;align-items:center;gap:10px;margin-left:auto}\n.rv-nav button{width:46px;height:46px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff;cursor:pointer;font-size:20px;color:var(--ink)}\n.rv-nav button:hover{box-shadow:inset 0 0 0 1px var(--ink)}\n.rv-nav span{font-size:14px;color:var(--muted);min-width:52px;text-align:center}\n.rating{border-left:1px solid var(--line);padding-left:48px}\n.rating b{font-size:64px;font-weight:500;letter-spacing:-.04em;line-height:1}\n.rating .st{display:flex;gap:3px;color:var(--acc);margin:10px 0}\n.rating .st svg{width:18px;height:18px}\n.rating p{color:var(--muted);font-size:15px;margin-bottom:16px}\n\n/* вопросы */\n.faq{border-top:1px solid var(--ink)}\n.faq details{border-bottom:1px solid var(--line)}\n.faq summary{list-style:none;cursor:pointer;padding:26px 0;font-weight:500;font-size:19px;display:flex;justify-content:space-between;gap:20px}\n.faq summary::-webkit-details-marker{display:none}\n.faq summary::after{content:\"+\";color:var(--acc);font-weight:300;font-size:26px;line-height:1;transition:transform .2s}\n.faq details[open] summary::after{transform:rotate(45deg)}\n.faq details p{padding:0 0 28px;color:#3A3F47;max-width:70ch}\n\n/* контакты */\n.ct{display:grid;grid-template-columns:1.2fr 1fr;gap:96px;align-items:start}\n.ct .bigtel{display:block;font-size:clamp(34px,4.4vw,58px);font-weight:500;letter-spacing:-.035em;text-decoration:none;line-height:1.05}\n.ct .bigtel:hover{color:var(--acc)}\n.ct .hrs{margin-top:14px;color:var(--muted)}\n.ct .row{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}\n.brs{border-top:1px solid var(--ink)}\n.brs div{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}\n.brs b{font-weight:500;display:block}\n.brs small{color:var(--muted);font-size:14.5px}\n.brs a{font-size:14.5px}\nfooter{padding:40px 0 56px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}\nfooter .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}\n\n@media (max-width:1060px){.nav{display:none}.prices{grid-template-columns:1fr 1fr}.pr:nth-child(3){padding-left:0;border-left:0}.pr:nth-child(n+3){border-top:1px solid var(--line)}}\n@media (max-width:760px){\n  html{scroll-padding-top:66px}\n  .wrap{width:calc(100% - 32px)}\n  body{font-size:16px}\n  .hd{height:58px;gap:12px}\n  .tel{display:none}\n  .hero{grid-template-columns:1fr;padding:40px 0 40px;gap:24px;min-height:0;max-height:none}\n  .hero h1{font-size:38px}\n  .hero .sub{font-size:17px;margin-top:16px}\n  .hero .row{margin-top:22px;gap:18px}\n  .hero .row .btn{width:100%;justify-content:center}\n  .steps{justify-self:stretch;max-width:none;order:-1;margin:-6px 0 0}\n  .facts{grid-template-columns:1fr 1fr}\n  .facts div,.facts div+div{padding:16px 12px 16px 0;border-left:0}\n  .facts div:nth-child(even){padding-left:16px;border-left:1px solid var(--line)}\n  .facts div:nth-child(n+3){border-top:1px solid var(--line)}\n  .facts b{font-size:23px}\n  .sec{padding:80px 0}\n  .sh{grid-template-columns:1fr;gap:16px;margin-bottom:36px}\n  .tabs{overflow-x:auto;flex-wrap:nowrap}\n  .tbl thead{display:none}\n  .tbl,.tbl tbody{display:block}\n  .tbl tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-bottom:1px solid var(--line)}\n  .tbl td{border:0;padding:0;font-size:15px}\n  .tbl td:first-child{font-size:17px}\n  .tbl td:nth-child(2){grid-column:1;color:var(--muted)}\n  .tbl td:nth-child(3){grid-row:1;grid-column:2;text-align:right}\n  .tbl td:nth-child(4){grid-column:1}\n  .tbl td:last-child{grid-row:2/4;grid-column:2;align-self:end}\n  .season{gap:24px;flex-direction:column}\n  .prices{grid-template-columns:1fr}\n  .pr,.pr+.pr{padding:28px 0;border-left:0;border-top:1px solid var(--line)}\n  .pr:first-child{border-top:0}\n  .pr .sum{font-size:36px}\n  .test,.rv,.ct{grid-template-columns:1fr;gap:40px}\n  #qcard{min-height:0}\n  .tr{grid-template-columns:56px 1fr;gap:4px 14px}\n  .tr .ph{width:56px;height:56px;grid-row:span 3}\n  .tr em{justify-self:start;margin-top:6px}\n  .rating{border-left:0;border-top:1px solid var(--line);padding:22px 0 0}\n  .rv-nav{margin-left:0}\n  .ct .row .btn{flex:1;justify-content:center}\n}\n<\/style>\n<\/head>\n<body>\n<!--SWITCH:START-->\n<style>\n  .sw-bar{position:sticky;top:0;z-index:100;display:none;align-items:center;gap:12px;flex-wrap:wrap;\n    background:#141414;color:#fff;font:500 13px/1.2 system-ui,\"Segoe UI\",sans-serif;\n    padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left))}\n  body.has-sw .sw-bar{display:flex}\n  body.has-sw header{top:var(--swh,44px)}\n  .sw-bar .sw-t{font-weight:700;letter-spacing:.08em;white-space:nowrap}\n  .sw-bar .sw-t span{font-weight:400;letter-spacing:0;color:#9a9a9a;margin-left:6px}\n  .sw-bar .sw-g{display:flex;background:#2a2a2a;border-radius:9px;padding:3px}\n  .sw-bar .sw-g:first-of-type{margin-left:auto}\n  .sw-bar a{color:#cfcfcf;text-decoration:none;padding:6px 11px;border-radius:7px;white-space:nowrap}\n  .sw-bar a:hover{color:#fff}\n  .sw-bar a[aria-current=\"true\"]{background:#fff;color:#141414;font-weight:600}\n  .sw-bar a:focus-visible{outline:2px solid #FFAE2B;outline-offset:2px}\n  @media (max-width:700px){.sw-bar .sw-t{display:none}.sw-bar .sw-g:first-of-type{margin-left:0}.sw-bar .sw-g{flex:1}.sw-bar a{flex:1;text-align:center;padding:6px 4px}}\n<\/style>\n<nav class=\"sw-bar\" aria-label=\"Переключатель макетов\"><div class=\"sw-t\">ENGLISH ZONE<span>макеты сайта<\/span><\/div><div class=\"sw-g\" role=\"group\" aria-label=\"Сайт\"><a href=\"v1-zona.html\" aria-current=\"false\">1 · Зона<\/a><a href=\"v2-shagi.html\" aria-current=\"true\">2 · Шаги<\/a><a href=\"v3-sezon.html\" aria-current=\"false\">3 · Сезон<\/a><\/div><div class=\"sw-g\" role=\"group\" aria-label=\"Устройство\"><a href=\"v2-shagi.html\" aria-current=\"true\">ПК<\/a><a href=\"index.html#v2-mob\" aria-current=\"false\">Телефон<\/a><\/div><\/nav>\n<script>if(window.top===window.self){document.body.classList.add(\"has-sw\");const swh=()=>{const h=document.querySelector(\".sw-bar\").offsetHeight;document.body.style.setProperty(\"--swh\",h+\"px\");document.documentElement.style.scrollPaddingTop=(h+90)+\"px\";};swh();addEventListener(\"resize\",swh);}<\/script>\n<!--SWITCH:END-->\n\n<header>\n  <div class=\"wrap hd\">\n    <a class=\"wm\" href=\"#top\"><svg viewBox=\"0 0 24 32\"><use href=\"#i-foot\"/><\/svg>English Zone<\/a>\n    <nav class=\"nav\" aria-label=\"Разделы\">\n      <a href=\"#schedule\" data-kg=\"Жадыбал\">Расписание<\/a>\n      <a href=\"#prices\" data-kg=\"Баалар\">Цены<\/a>\n      <a href=\"#test\" data-kg=\"Тест\">Тест<\/a>\n      <a href=\"#team\" data-kg=\"Мугалимдер\">Преподаватели<\/a>\n      <a href=\"#reviews\" data-kg=\"Пикирлер\">Отзывы<\/a>\n      <a href=\"#contacts\" data-kg=\"Байланыш\">Контакты<\/a>\n    <\/nav>\n    <div class=\"hd-r\">\n      <a class=\"tel\" href=\"tel:+996770692299\">+996 770 69 22 99<\/a>\n      <a class=\"ic-b btn-wa\" data-wa href=\"#\" aria-label=\"WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a>\n      <a class=\"ic-b btn-gis\" data-gis href=\"#\" aria-label=\"2ГИС\"><svg><use href=\"#i-pin\"/><\/svg><\/a>\n      <div class=\"lang\" role=\"group\" aria-label=\"Язык\"><button data-l=\"ru\">RU<\/button><button data-l=\"kg\">KG<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n<div class=\"wrap\">\n  <section class=\"hero\">\n    <div>\n      <h1 data-kg=\"Англисче сүйлөңүз.<span>Англисче гана.<\/span>\">Говорите по&#8209;английски.<span>Только по&#8209;английски.<\/span><\/h1>\n      <p class=\"sub\" data-kg=\"Сабакта бир да орусча сөз жок — ошондуктан окуучулар 2–3 айдан кийин сүйлөй башташат. Топто 6–8 адам, Бишкекте 3 филиал.\">На уроках ни слова по-русски — поэтому студенты начинают говорить через 2–3 месяца. Группы по 6–8 человек, 3 филиала в Бишкеке.<\/p>\n      <div class=\"row\">\n        <a class=\"btn btn-acc\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Акысыз сынамык сабакка жазылуу\">Записаться на бесплатный пробный<\/span><\/a>\n        <a class=\"lnk\" href=\"#test\" data-kg=\"Деңгээлди билүү — 10 суроо\">Узнать уровень — 10 вопросов<\/a>\n      <\/div>\n    <\/div>\n    <!-- Анимация: следы поднимаются по ступеням уровней -->\n    <svg class=\"steps\" viewBox=\"0 0 520 462\" role=\"img\" aria-label=\"Уровни: от Beginner до IELTS\">\n      <path class=\"stair\" d=\"M10 420 H110 V352 H190 V284 H270 V216 H350 V148 H430 V80 H510\"/>\n      <text class=\"lbl\" x=\"14\" y=\"442\">Beginner<\/text>\n      <text class=\"lbl\" x=\"114\" y=\"374\">Elementary<\/text>\n      <text class=\"lbl\" x=\"194\" y=\"306\">Pre-Int<\/text>\n      <text class=\"lbl\" x=\"274\" y=\"238\">Intermediate<\/text>\n      <text class=\"lbl\" x=\"354\" y=\"170\">Upper-Int<\/text>\n      <text class=\"lbl top\" x=\"434\" y=\"102\">IELTS 7.0+<\/text>\n      <g id=\"fps\"><\/g>\n    <\/svg>\n  <\/section>\n\n  <div class=\"facts\">\n    <div><b>31,5 <span data-kg=\"миң\">тыс.<\/span><\/b><span data-kg=\"Instagramда окурман\">подписчиков в Instagram<\/span><\/div>\n    <div><b>6–8<\/b><span data-kg=\"адам топто\">человек в группе<\/span><\/div>\n    <div><b>90 <span data-kg=\"мүн\">мин<\/span><\/b><span data-kg=\"бир сабак\">один урок<\/span><\/div>\n    <div><b>9:10–21:30<\/b><span data-kg=\"дүйшөмбү – жума\">понедельник – пятница<\/span><\/div>\n  <\/div>\n<\/div>\n\n<!-- Расписание -->\n<section class=\"sec\" id=\"schedule\">\n  <div class=\"wrap\">\n    <div class=\"sh\">\n      <div><div class=\"k\"><svg><use href=\"#i-cal\"/><\/svg><span data-kg=\"Жадыбал\">Расписание<\/span><\/div><h2 data-kg=\"Ыңгайлуу убакытты тандаңыз\">Выберите удобное время<\/h2><\/div>\n      <p data-kg=\"Сабактар жумасына 3 жолу (ДШ·ШР·ЖМ) же 2 жолу (ШЕ·БШ, узартылган). Жадыбал үч филиалда тең бирдей.\">Занятия 3 раза в неделю (ПН·СР·ПТ) или 2 раза (ВТ·ЧТ, удлинённые). Расписание одинаковое во всех филиалах.<\/p>\n    <\/div>\n    <div class=\"tabs\" role=\"group\" aria-label=\"Время\">\n      <button data-t=\"am\" aria-pressed=\"false\" data-kg=\"Эртең\">Утро<\/button>\n      <button data-t=\"pm\" aria-pressed=\"false\" data-kg=\"Күндүз · балдар\">День · дети<\/button>\n      <button data-t=\"ev\" aria-pressed=\"true\" data-kg=\"Кеч\">Вечер<\/button>\n      <button data-t=\"all\" aria-pressed=\"false\" data-kg=\"Бардык топтор\">Все группы<\/button>\n    <\/div>\n    <table class=\"tbl\">\n      <thead><tr><th data-kg=\"Деңгээл\">Уровень<\/th><th data-kg=\"Күндөр\">Дни<\/th><th data-kg=\"Убакыт\">Время<\/th><th data-kg=\"Орундар\">Места<\/th><th><\/th><\/tr><\/thead>\n      <tbody id=\"sched\"><\/tbody>\n    <\/table>\n    <div class=\"season\">\n      <div><b data-kg=\"Сен\">Сен<\/b><span><strong data-kg=\"Күзгү топтор\">Осенний набор<\/strong><span data-kg=\"8 айга, бардык деңгээлдер\">на 8 месяцев, все уровни<\/span><\/span><\/div>\n      <div><b data-kg=\"Янв\">Янв<\/b><span><strong data-kg=\"Кышкы топтор\">Зимний набор<\/strong><span data-kg=\"жайга чейин\">до лета<\/span><\/span><\/div>\n      <div><b data-kg=\"Жай\">Лето<\/b><span><strong>Kids Camp<\/strong><span data-kg=\"7–13 жаш, июнь–август\">7–13 лет, июнь–август<\/span><\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Цены -->\n<section class=\"sec tint\" id=\"prices\">\n  <div class=\"wrap\">\n    <div class=\"sh\">\n      <div><div class=\"k\"><svg><use href=\"#i-tag\"/><\/svg><span data-kg=\"Баалар\">Цены<\/span><\/div><h2 data-kg=\"Айына, жашыруун төлөмсүз\">За месяц, без скрытых платежей<\/h2><\/div>\n      <p data-kg=\"12 сабак айына. Окуу китептери баага кошулган.\">12 уроков в месяц. Учебники входят в стоимость.<\/p>\n    <\/div>\n    <div class=\"prices\">\n      <div class=\"pr\"><h3 data-kg=\"Чоңдор тобу\">Группа для взрослых<\/h3><div class=\"sum\">4 500 <small data-kg=\"сом\">сом<\/small><\/div><p data-kg=\"Beginner → Advanced, 6–8 адам\">Beginner → Advanced, 6–8 человек<\/p><a class=\"lnk\" data-wa=\"Здравствуйте! Интересует группа для взрослых.\" data-wa-kg=\"Саламатсызбы! Чоңдор тобу кызыктырат.\" href=\"#\" data-kg=\"Жазылуу\">Записаться<\/a><\/div>\n      <div class=\"pr\"><h3 data-kg=\"Балдар 7–16\">Дети 7–16 лет<\/h3><div class=\"sum\">4 000 <small data-kg=\"сом\">сом<\/small><\/div><p data-kg=\"Оюн аркылуу, ата-энеге отчёт\">Через игру, отчёт родителям<\/p><a class=\"lnk\" data-wa=\"Здравствуйте! Интересует группа для ребёнка.\" data-wa-kg=\"Саламатсызбы! Балага топ кызыктырат.\" href=\"#\" data-kg=\"Жазылуу\">Записаться<\/a><\/div>\n      <div class=\"pr\"><h3>IELTS<\/h3><div class=\"sum\">6 000 <small data-kg=\"сом\">сом<\/small><\/div><p data-kg=\"Ай сайын пробный тест, максат 7.0+\">Пробный тест каждый месяц, цель 7.0+<\/p><a class=\"lnk\" data-wa=\"Здравствуйте! Интересует подготовка к IELTS.\" data-wa-kg=\"Саламатсызбы! IELTS даярдоо кызыктырат.\" href=\"#\" data-kg=\"Жазылуу\">Записаться<\/a><\/div>\n      <div class=\"pr\"><h3 data-kg=\"Жеке\">Индивидуально<\/h3><div class=\"sum\">1 000 <small data-kg=\"сом / сабак\">сом / урок<\/small><\/div><p data-kg=\"Онлайн же офлайн, ыңгайлуу убакытта\">Онлайн или офлайн, в удобное время<\/p><a class=\"lnk\" data-wa=\"Здравствуйте! Интересуют индивидуальные уроки.\" data-wa-kg=\"Саламатсызбы! Жеке сабактар кызыктырат.\" href=\"#\" data-kg=\"Жазылуу\">Записаться<\/a><\/div>\n    <\/div>\n    <div class=\"free\"><b data-kg=\"Биринчи сабак — акысыз\">Первый урок — бесплатно<\/b><span data-kg=\"Деңгээлди аныктап, топту сунуштайбыз. Эч кандай милдеттенме жок.\">Определим уровень и подберём группу. Без обязательств.<\/span><a class=\"btn btn-acc\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Жазылуу\">Записаться<\/span><\/a><\/div>\n  <\/div>\n<\/section>\n\n<!-- Тест -->\n<section class=\"sec\" id=\"test\">\n  <div class=\"wrap test\">\n    <div>\n      <div class=\"sh\" style=\"display:block;margin:0\"><div class=\"k\"><svg><use href=\"#i-q\"/><\/svg><span data-kg=\"Деңгээл тести\">Тест уровня<\/span><\/div><h2 data-kg=\"Кайсы кадамдан баштайсыз?\">С какой ступени начнёте?<\/h2><\/div>\n      <ol>\n        <li data-kg=\"10 суроого жооп бериңиз — 2 мүнөт\">Ответьте на 10 вопросов — 2 минуты<\/li>\n        <li data-kg=\"Деңгээлиңизди жана ылайыктуу топту көрөсүз\">Увидите уровень и подходящую группу<\/li>\n        <li data-kg=\"Жыйынтыкты WhatsAppка жөнөтүп, сынамык сабакка жазылыңыз\">Отправьте результат в WhatsApp и запишитесь на пробный<\/li>\n      <\/ol>\n    <\/div>\n    <div id=\"qcard\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- Команда -->\n<section class=\"sec tint\" id=\"team\">\n  <div class=\"wrap\">\n    <div class=\"sh\">\n      <div><div class=\"k\"><svg><use href=\"#i-users\"/><\/svg><span data-kg=\"Мугалимдер\">Преподаватели<\/span><\/div><h2 data-kg=\"Сабакты ким өтөт\">Кто ведёт уроки<\/h2><\/div>\n      <p data-kg=\"Баарында эл аралык сертификат бар. Сынамык сабакта мугалимди өзүңүз тандай аласыз.\">У всех международные сертификаты. На пробном уроке можно выбрать преподавателя.<\/p>\n    <\/div>\n    <div class=\"team\">\n      <div class=\"tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><b data-kg=\"Айжан\">Айжан<\/b><span data-kg=\"Башкы мугалим, IELTS даярдоо\">Head teacher, подготовка к IELTS<\/span><em>IELTS 8.0<\/em><\/div>\n      <div class=\"tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><b data-kg=\"Тимур\">Тимур<\/b><span data-kg=\"Чоңдор үчүн сүйлөшүү, Speaking Club\">Разговорный для взрослых, Speaking Club<\/span><em>CELTA<\/em><\/div>\n      <div class=\"tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><b data-kg=\"Мээрим\">Мээрим<\/b><span data-kg=\"Балдар 7–13, Kids Camp\">Дети 7–13 лет, Kids Camp<\/span><em>TKT<\/em><\/div>\n      <div class=\"tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><b data-kg=\"Дастан\">Дастан<\/b><span data-kg=\"Грамматика, Intermediate жана жогору\">Грамматика, Intermediate и выше<\/span><em>IELTS 7.5<\/em><\/div>\n      <div class=\"tr\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><b data-kg=\"Камила\">Камила<\/b><span data-kg=\"Нөлдөн баштагандар жана өспүрүмдөр\">С нуля и подростки<\/span><em>TESOL<\/em><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Отзывы -->\n<section class=\"sec\" id=\"reviews\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><div class=\"k\"><svg><use href=\"#i-chat\"/><\/svg><span data-kg=\"Пикирлер\">Отзывы<\/span><\/div><h2 data-kg=\"Окуучулар эмне дейт\">Что говорят студенты<\/h2><\/div><\/div>\n    <div class=\"rv\">\n      <div>\n        <blockquote id=\"rvQ\" aria-live=\"polite\"><\/blockquote>\n        <div class=\"who\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b id=\"rvN\"><\/b><small id=\"rvM\"><\/small><\/div>\n          <div class=\"rv-nav\"><button type=\"button\" id=\"rvP\" aria-label=\"Предыдущий\">←<\/button><span id=\"rvC\"><\/span><button type=\"button\" id=\"rvX\" aria-label=\"Следующий\">→<\/button><\/div><\/div>\n      <\/div>\n      <div class=\"rating\">\n        <b>4,9<\/b>\n        <div class=\"st\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/div>\n        <p data-kg=\"2ГИСтеги орточо баа*\">средняя оценка в 2ГИС*<\/p>\n        <a class=\"lnk\" data-gis href=\"#\" data-kg=\"Бардык пикирлер 2ГИСте\">Все отзывы в 2ГИС<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Вопросы -->\n<section class=\"sec tint\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><div class=\"k\"><svg><use href=\"#i-q\"/><\/svg><span data-kg=\"Суроолор\">Вопросы<\/span><\/div><h2 data-kg=\"Көп берилүүчү суроолор\">Частые вопросы<\/h2><\/div><\/div>\n    <div class=\"faq\">\n      <details><summary data-kg=\"Мен нөлдөн баштайм. Англисче гана түшүнөмбү?\">Я с нуля. Пойму ли я, если говорят только по-английски?<\/summary><p data-kg=\"Ооба. Мугалим сүрөт, жест жана жөнөкөй сөздөр менен түшүндүрөт. Биринчи жумада эле кадимки фразаларды айта баштайсыз.\">Да. Преподаватель объясняет картинками, жестами и простыми словами. Уже в первую неделю вы начнёте говорить базовые фразы.<\/p><\/details>\n      <details><summary data-kg=\"10 сом айып — чынбы?\">Штраф 10 сом — это всерьёз?<\/summary><p data-kg=\"Ооба, бирок бул оюн. Ар бир орусча сөз үчүн 10 сом копилкага, акча кайрымдуулукка кетет.\">Да, но это игра. За каждое русское слово — 10 сом в копилку, деньги уходят на благотворительность.<\/p><\/details>\n      <details><summary data-kg=\"Сабакты өткөрүп жиберсем эмне болот?\">Что если я пропущу урок?<\/summary><p data-kg=\"Ошол эле деңгээлдеги башка топко бекер келе аласыз — администратор жайгаштырат.\">Можно бесплатно прийти в другую группу того же уровня — администратор подберёт время.<\/p><\/details>\n      <details><summary data-kg=\"Жаңы топтор качан ачылат?\">Когда открываются новые группы?<\/summary><p data-kg=\"Чоң топтор сентябрда жана январда. Бош орун болсо, каалаган айда кошулса болот.\">Большие наборы — в сентябре и январе. Если есть места, можно присоединиться в любой месяц.<\/p><\/details>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Контакты -->\n<section class=\"sec\" id=\"contacts\">\n  <div class=\"wrap ct\">\n    <div>\n      <div class=\"sh\" style=\"display:block;margin:0 0 26px\"><div class=\"k\"><svg><use href=\"#i-phone\"/><\/svg><span data-kg=\"Байланыш\">Контакты<\/span><\/div><\/div>\n      <a class=\"bigtel\" href=\"tel:+996770692299\">+996 770 69 22 99<\/a>\n      <p class=\"hrs\" data-kg=\"Дүйшөмбү – жума, 9:10–21:30. Телефон жана WhatsApp — бир номер.\">Понедельник – пятница, 9:10–21:30. Телефон и WhatsApp — один номер.<\/p>\n      <div class=\"row\">\n        <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>WhatsApp<\/a>\n        <a class=\"btn btn-gis\" data-gis href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a>\n        <a class=\"btn btn-line\" href=\"https://www.instagram.com/ezone_kg\" target=\"_blank\" rel=\"noopener\"><svg><use href=\"#i-ig\"/><\/svg>@ezone_kg<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"brs\">\n      <div><span><b data-kg=\"Юнусалиев көч., 129\">ул. Юнусалиева, 129<\/b><small data-kg=\"Башкы филиал\">Главный филиал<\/small><\/span><a class=\"lnk\" data-gis href=\"#\" data-kg=\"Маршрут\">Маршрут<\/a><\/div>\n      <div><span><b>Manas office<\/b><small data-kg=\"Манас пр., дарек такталат\">пр. Манаса, адрес уточняется<\/small><\/span><a class=\"lnk\" data-gis href=\"#\" data-kg=\"Маршрут\">Маршрут<\/a><\/div>\n      <div><span><b>Panfilov st.<\/b><small data-kg=\"Панфилов көч., дарек такталат\">ул. Панфилова, адрес уточняется<\/small><\/span><a class=\"lnk\" data-gis href=\"#\" data-kg=\"Маршрут\">Маршрут<\/a><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<footer><div class=\"wrap\"><span>© English Zone<\/span><span data-kg=\"* — макеттеги мисал маалыматтар\">* — примерные данные макета<\/span><\/div><\/footer>\n\n<!--CORE:START-->\n<!-- Общая часть для всех вариантов English Zone (build.py вставляет её между CORE:START и CORE:END).\n     Здесь: значки (sprite), нижняя панель на телефоне, перевод RU/KG, ссылки WhatsApp.\n     Цвета панели задаёт вариант: --mb-bg, --mb-fg. -->\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-wa\" viewBox=\"0 0 24 24\"><path fill=\"currentColor\" d=\"M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.6 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.4.2.5.3.1.2.1.7-.2 1.3z\"/><\/symbol>\n  <symbol id=\"i-phone\" viewBox=\"0 0 24 24\"><path fill=\"currentColor\" d=\"M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z\"/><\/symbol>\n  <symbol id=\"i-pin\" viewBox=\"0 0 24 24\"><path fill=\"currentColor\" d=\"M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z\"/><\/symbol>\n  <symbol id=\"i-ig\" viewBox=\"0 0 24 24\"><path fill=\"none\" str ==== Вариант 3 «Сезон» — яркий: цвета радужного следа их Kids Camp, стикеры, подбор группы ===== */\n:root{\n  --ink:#1A1433;--muted:#5E5873;--paper:#fff;--lilac:#F1EDFF;\n  --coral:#FF5A4E;--sun:#FFC226;--mint:#14B88C;--sky:#2F7BFF;--violet:#6E46FF;\n  --h:\"Dela Gothic One\",system-ui,sans-serif;--b:\"Golos Text\",system-ui,\"Segoe UI\",sans-serif;\n  --mb-bg:#fff;--mb-fg:#1A1433;--ph-bg:rgba(255,255,255,.55);--ph-fg:rgba(26,20,51,.35);\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:84px}\nbody{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.55 var(--b);-webkit-font-smoothing:antialiased}\na{color:inherit}\nsvg{display:block}\n.wrap{width:min(1200px,100% - 40px);margin-inline:auto}\n:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:8px}\nh1,h2,h3{font-family:var(--h);font-weight:400;margin:0;line-height:1.08}\nh2{font-size:clamp(28px,3.4vw,44px)}\n.lead{color:var(--muted);font-size:17.5px;max-width:50ch;margin:16px 0 0}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:16px;padding:15px 22px;font:700 16px/1 var(--b);text-decoration:none;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 rgba(26,20,51,.9);transition:transform .1s,box-shadow .1s}\n.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(26,20,51,.9)}\n.btn svg{width:19px;height:19px}\n.btn-wa{background:#25D366;color:#fff}\n.btn-ink{background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--violet)}\n.btn-w{background:#fff;color:var(--ink)}\n.btn-gis{background:#2FB540;color:#fff}\n\n/* шапка */\nheader{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--ink)}\n.hd{display:flex;align-items:center;gap:24px;height:72px}\n.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 19px/1 var(--h)}\n.logo svg{width:26px;height:34px}\n.nav{display:flex;gap:6px}\n.nav a{text-decoration:none;font-weight:600;font-size:15px;padding: \n.stk.s3{left:10%;bottom:9%;background:var(--mint);color:#fff;transform:rotate(-3deg)}\n@media (prefers-reduced-motion:no-preference){\n  .collage .f{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}\n  @keyframes pop{from{transform:scale(0) rotate(var(--r))}to{transform:scale(1) rotate(var(--r))}}\n}\n\n/* полоса-бегущая строка */\n.tape{background:var(--coral);color:#fff;border-block:2px solid var(--ink);overflow:hidden;white-space:nowrap}\n.tape div{display:inline-flex;gap:40px;padding:12px 0;font:400 19px/1 var(--h);animation:tape 30s linear infinite}\n.tape span{display:inline-flex;align-items:center;gap:40px}\n.tape span::after{content:\"\";width:12px;height:12px;border-radius:50%;background:var(--sun)}\n@keyframes tape{to{transform:translateX(-50%)}}\n@media (prefers-reduced-motion:reduce){.tape div{animation:none}}\n\n/* секции */\n.sec{padding:104px 0}\n.sec.lil{background:var(--lilac)}\n.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:48px;flex-wrap:wrap}\n.badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;border:2px solid var(--ink);border-radius:999px;padding:6px 14px 6px 8px;margin-bottom:20px;background:#fff}\n.badge i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}\n.badge svg{width:15px;height:15px}\n\n/* подбор группы */\n.finder{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:stretch}\n.fs{background:#fff;border:2px solid var(--ink);border-radius:28px;padding:32px}\n.fq{margin:0 0 28px}\n.fq:last-child{margin:0}\n.fq b{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:12px}\n.fq b i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:400 13px var(--h)}\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chips button{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:11px 15px;font:600 15.5px var(--b);cursor:pointer;color:var(--ink);transition:transform .12s}\n.chips button:hover{transform:translateY(-2px)}\n.chips button[aria-pressed=\"true\"]{background:var(--c,var(--violet));color:#fff;box-shadow:3px 3px 0 var(--ink)}\n.res{border:2px solid var(--ink);border-radius:28px;padding:32px;background:var(--violet);color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}\n.res .ft{position:absolute;right:-20px;bottom:-30px;width:150px;opacity:.16}\n.res small{font-weight:600;opacity:.8}\n.res h3{font-size:32px;margin:6px 0 14px}\n.res ul{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}\n.res li{display:flex;gap:10px;align-items:center;font-size:16.5px}\n.res li svg{width:20px;height:20px;flex:0 0 auto;color:var(--sun)}\n.res .tip{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-size:14.5px;margin-bottom:18px}\n.res .btn{margin-top:auto;align-self:flex-start}\n\n/* сезоны */\n.seasons{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}\n.se{border:2px solid var(--ink);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:6px 6px 0 var(--ink)}\n.se .mo{font:400 54px/0.9 var(--h)}\n.se h3{font-size:22px}\n.se p{margin:0;font-size:15.5px}\n.se ul{margin:0;padding:0 0 0 18px;font-size:15px;display:grid;gap:4px}\n.se .btn{margin-top:auto;align-self:flex-start}\n.se.a{background:var(--coral);color:#fff}\n.se.b{background:var(--sky);color:#fff}\n.se.c{background:var(--sun)}\n\n/* цены */\n.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}\n.pr{border:2px solid var(--ink);border-radius:24px;background:#fff;overflow:hidden;display:flex;flex-direction:column}\n.pr .top{padding:22px 24px;background:var(--c);color:#fff;border-bottom:2px dashed var(--ink)}\n.pr .top h3{font:700 17px/1.25 var(--b)}\n.pr .sum{font:400 34px/1 var(--h);margin-top:10px}\n.pr .sum small{font:600 14px var(--b);opacity:.9}\n.pr .bd{padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1;font-size:15px}\n.pr .bd div{display:flex;gap:8px}\n.pr .bd svg{flex:0 0 18px;width:18px;height:18px;color:var(--mint);margin-top:2px}\n.pr .btn{margin-top:auto;padding:12px 16px;font-size:15px;align-self:flex-start}\n.gift{margin-top:32px;border:2px solid var(--ink);border-radius:24px;background:var(--sun);padding:24px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}\n.gift b{font:400 22px var(--h)}\n.gift span{flex:1;min-width:240px}\n\n/* тест */\n.test{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:center}\n.sec.vio{background:var(--violet);color:#fff}\n.sec.vio .lead{color:rgba(255,255,255,.85)}\n.test .pts{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}\n.test .pts span{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14.5px}\n#qcard{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:28px;padding:36px;box-shadow:8px 8px 0 var(--ink);min-height:440px;--qa:var(--violet);--qopt:var(--lilac);--qh:var(--h);--qtrack:#E3DDF7;--qnext:var(--lilac);--qcall:var(--ink);--qr:14px}\n#qcard .qt-q{font-weight:400}\n#qcard .qt-opts button{border:2px solid var(--ink)}\n\n/* команда */\n.team{display:grid;grid-template-columns:repeat(5,1fr);gap:24px}\n.tc{border:2px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--c)}\n.tc .ph{aspect-ratio:1/1;border-bottom:2px solid var(--ink)}\n.tc div.t{padding:18px 20px 20px;background:#fff}\n.tc b{display:block;font:400 19px var(--h)}\n.tc span{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:4px}\n.tc em{display:inline-block;font-style:normal;font-weight:700;font-size:12.5px;background:var(--c);color:#fff;border-radius:8px;padding:3px 8px;margin-top:8px}\n\n/* отзывы — сообщения */\n.rv{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}\n.msg{border:2px solid var(--ink);border-radius:22px 22px 22px 6px;padding:24px 26px;background:#fff}\n.msg:nth-c
