ero\">\n  <div>\n    <h1 data-kg=\"Бүт үй-бүлө үчүн англис тили: 7&nbsp;жаштан IELTSке чейин\">Английский для всей семьи: <span style=\"white-space:nowrap\">от 7 лет<\/span> до&nbsp;IELTS<\/h1>\n    <p class=\"lead\" data-kg=\"Бишкектеги курстар: балдар, өспүрүмдөр, чоңдор жана IELTS. Сабакта англисче гана — орусча сөз үчүн 10 сом кайрымдуулукка.\">Курсы в Бишкеке для детей, подростков, взрослых и IELTS. На уроке только английский — за русское слово 10 сом на благотворительность.<\/p>\n    <div class=\"row\">\n      <a class=\"btn btn-ink\" href=\"#finder\"><span data-kg=\"Топ тандоо\">Подобрать группу<\/span><\/a>\n      <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg><span data-kg=\"Сынамык сабак\">Пробный урок<\/span><\/a>\n    <\/div>\n    <div class=\"count\">\n      <div class=\"d\" id=\"cdD\">—<\/div>\n      <div><b id=\"cdT\"><\/b><span id=\"cdS\"><\/span><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"collage\" aria-hidden=\"true\">\n    <div class=\"f\" style=\"left:30%;top:58%;--r:-14deg;transform:rotate(-14deg);animation-delay:0s;width:12%\"><svg viewBox=\"0 0 24 32\" style=\"transform:scaleX(-1)\"><use href=\"#rbfoot\"/><\/svg><\/div>\n    <div class=\"f\" style=\"left:58%;top:6%;--r:18deg;transform:rotate(18deg);animation-delay:.1s\"><svg viewBox=\"0 0 24 32\"><use href=\"#rbfoot\"/><\/svg><\/div>\n    <div class=\"f\" style=\"left:74%;top:16%;--r:28deg;transform:rotate(28deg);animation-delay:.25s\"><svg viewBox=\"0 0 24 32\" style=\"transform:scaleX(-1)\"><use href=\"#rbfoot\"/><\/svg><\/div>\n    <div class=\"f\" style=\"left:44%;top:46%;--r:-8deg;transform:rotate(-8deg);animation-delay:.4s;width:20%\"><svg viewBox=\"0 0 24 32\"><use href=\"#rbfoot\"/><\/svg><\/div>\n    <div class=\"f\" style=\"left:70%;top:64%;--r:12deg;transform:rotate(12deg);animation-delay:.55s\"><svg viewBox=\"0 0 24 32\" style=\"transform:scaleX(-1)\"><use href=\"#rbfoot\"/><\/svg><\/div>\n    <div class=\"stk s1\"><big>31,5K<\/big><span data-kg=\"Instagramда\">в Instagram<\/span><\/div>\n    <div class=\"stk s2\" data-kg=\"«WE SPEAK ONLY ENGLISH HERE!» — эшиктин жанындагы эреже\">«WE SPEAK ONLY ENGLISH HERE!» — правило у входа<\/div>\n    <div class=\"stk s3\"><big>3<\/big><span data-kg=\"филиал\">филиала<\/span><\/div>\n  <\/div>\n<\/section>\n\n<div class=\"tape\" aria-hidden=\"true\"><div>\n  <span>Kids 7–13<\/span><span>Teens<\/span><span>Adults<\/span><span>IELTS 7.0+<\/span><span>Speaking Club<\/span><span>Kids Camp<\/span>\n  <span>Kids 7–13<\/span><span>Teens<\/span><span>Adults<\/span><span>IELTS 7.0+<\/span><span>Speaking Club<\/span><span>Kids Camp<\/span>\n<\/div><\/div>\n\n<!-- Подбор группы -->\n<section class=\"sec lil\" id=\"finder\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"badge\"><i style=\"background:var(--violet)\"><svg><use href=\"#i-users\"/><\/svg><\/i><span data-kg=\"3 кадам\">3 шага<\/span><\/span><h2 data-kg=\"Өзүңүзгө топ тандаңыз\">Подберите свою группу<\/h2><\/div>\n      <p class=\"lead\" style=\"margin:0\" data-kg=\"Тандаңыз — топту жана убакытты көрсөтөбүз. Арыз WhatsAppка даяр текст менен кетет.\">Выберите — покажем группу и время. Заявка уйдёт в WhatsApp с готовым текстом.<\/p><\/div>\n    <div class=\"finder\">\n      <div class=\"fs\">\n        <div class=\"fq\"><b><i>1<\/i><span data-kg=\"Ким окуйт?\">Кто будет учиться?<\/span><\/b>\n          <div class=\"chips\" data-q=\"who\">\n            <button data-v=\"kids\" style=\"--c:var(--coral)\" data-kg=\"Бала 7–12\">Ребёнок 7–12<\/button>\n            <button data-v=\"teens\" style=\"--c:var(--sky)\" data-kg=\"Өспүрүм 13–16\">Подросток 13–16<\/button>\n            <button data-v=\"adults\" style=\"--c:var(--violet)\" data-kg=\"Чоң адам\">Взрослый<\/button>\n            <button data-v=\"ielts\" style=\"--c:var(--mint)\" data-kg=\"IELTSке даярдык\">Подготовка к IELTS<\/button>\n          <\/div><\/div>\n        <div class=\"fq\"><b><i>2<\/i><span data-kg=\"Кайсы филиал ыңгайлуу?\">Какой филиал удобнее?<\/span><\/b>\n          <div class=\"chips\" data-q=\"br\">\n            <button data-v=\"yun\" style=\"--c:var(--ink)\" data-kg=\"Юнусалиев, 129\">Юнусалиева, 129<\/button>\n            <button data-v=\"man\" style=\"--c:var(--ink)\" data-kg=\"Манас\">Манаса<\/button>\n            <button data-v=\"pan\" style=\"--c:var(--ink)\" data-kg=\"Панфилов\">Панфилова<\/button>\n          <\/div><\/div>\n        <div class=\"fq\"><b><i>3<\/i><span data-kg=\"Качан ыңгайлуу?\">Когда удобно?<\/span><\/b>\n          <div class=\"chips\" data-q=\"time\">\n            <button data-v=\"am\" style=\"--c:var(--sun);color:inherit\" data-kg=\"Эртең 9–13\">Утро 9–13<\/button>\n            <button data-v=\"pm\" style=\"--c:var(--coral)\" data-kg=\"Күндүз 14–18\">День 14–18<\/button>\n            <button data-v=\"ev\" style=\"--c:var(--sky)\" data-kg=\"Кеч 18:30–21:30\">Вечер 18:30–21:30<\/button>\n          <\/div><\/div>\n      <\/div>\n      <div class=\"res\" aria-live=\"polite\">\n        <svg class=\"ft\" viewBox=\"0 0 24 32\"><use href=\"#i-foot\"/><\/svg>\n        <small data-kg=\"Сизге ылайыктуу\">Вам подходит<\/small>\n        <h3 id=\"fT\"><\/h3>\n        <ul id=\"fL\"><\/ul>\n        <div class=\"tip\" id=\"fTip\" hidden><\/div>\n        <a class=\"btn btn-w\" id=\"fBtn\" href=\"#\" target=\"_blank\" rel=\"noopener\"><svg style=\"color:#25D366\"><use href=\"#i-wa\"/><\/svg><span data-kg=\"Бул топко жазылуу\">Записаться в эту группу<\/span><\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Сезонные наборы -->\n<section class=\"sec\" id=\"seasons\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"badge\"><i style=\"background:var(--coral)\"><svg><use href=\"#i-cal\"/><\/svg><\/i><span data-kg=\"Сезондук топтор\">Сезонные наборы<\/span><\/span><h2 data-kg=\"Жылына үч старт\">Три старта в году<\/h2><\/div>\n      <p class=\"lead\" style=\"margin:0\" data-kg=\"Орун болсо, каалаган айда кошулса болот — бирок жаңы топто баштоо оңой.\">Можно прийти в любой месяц, если есть места, — но с новой группой начинать легче.<\/p><\/div>\n    <div class=\"seasons\">\n      <article class=\"se a\"><div class=\"mo\" data-kg=\"Сентябрь\">Сентябрь<\/div><h3 data-kg=\"Күзгү топтор\">Осенний набор<\/h3>\n        <ul><li data-kg=\"Бардык деңгээлдер, 8 ай\">Все уровни, 8 месяцев<\/li><li data-kg=\"Балдар үчүн мектеп менен бирге\">Для детей — вместе со школой<\/li><li data-kg=\"Эрте жазылууга −10%\">−10% при ранней записи<\/li><\/ul>\n        <a class=\"btn btn-w\" data-wa=\"Здравствуйте! Хочу записаться в осенний набор.\" data-wa-kg=\"Саламатсызбы! Күзгү топко жазылгым келет.\" href=\"#\"><span data-kg=\"Орун ээлөө\">Забронировать место<\/span><\/a><\/article>\n      <article class=\"se b\"><div class=\"mo\" data-kg=\"Январь\">Январь<\/div><h3 data-kg=\"Кышкы топтор\">Зимний набор<\/h3>\n        <ul><li data-kg=\"Жаңы жылдан жаңы деңгээл\">Новый год — новый уровень<\/li><li data-kg=\"IELTS топтору: жайкы тапшырууга\">IELTS-группы к летней сдаче<\/li><li data-kg=\"Жайга чейин 5 ай\">5 месяцев до лета<\/li><\/ul>\n        <a class=\"btn btn-w\" data-wa=\"Здравствуйте! Хочу записаться в зимний набор.\" data-wa-kg=\"Саламатсызбы! Кышкы топко жазылгым келет.\" href=\"#\"><span data-kg=\"Орун ээлөө\">Забронировать место<\/span><\/a><\/article>\n      <article class=\"se c\"><div class=\"mo\" data-kg=\"Жай\">Лето<\/div><h3>Kids Camp<\/h3>\n        <ul><li data-kg=\"7–13 жаш, июнь–август\">7–13 лет, июнь–август<\/li><li data-kg=\"Оюндар, квесттер, кино — англисче\">Игры, квесты, кино — на английском<\/li><li data-kg=\"Жарым күн же толук күн\">Полдня или полный день<\/li><\/ul>\n        <a class=\"btn btn-ink\" data-wa=\"Здравствуйте! Хочу записать ребёнка в Kids Camp.\" data-wa-kg=\"Саламатсызбы! Баламды Kids Campка жазгым келет.\" href=\"#\"><span data-kg=\"Баланы жазуу\">Записать ребёнка<\/span><\/a><\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Цены -->\n<section class=\"sec lil\" id=\"prices\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"badge\"><i style=\"background:var(--mint)\"><svg><use href=\"#i-tag\"/><\/svg><\/i><span data-kg=\"Баалар\">Цены<\/span><\/span><h2 data-kg=\"Айына канча турат\">Сколько стоит в месяц<\/h2><\/div>\n      <p class=\"lead\" style=\"margin:0\" data-kg=\"12 сабак айына, китептер кошулган.\">12 уроков в месяц, учебники включены.<\/p><\/div>\n    <div class=\"prices\">\n      <div class=\"pr\" style=\"--c:var(--coral)\"><div class=\"top\"><h3 data-kg=\"Балдар 7–12\">Дети 7–12<\/h3><div class=\"sum\">4 000 <small data-kg=\"сом\">сом<\/small><\/div><\/div><div class=\"bd\"><div><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Оюн аркылуу окуу\">Обучение через игру<\/span><\/div><div><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Ата-энеге ай сайын отчёт\">Отчёт родителям каждый месяц<\/span><\/div><a class=\"btn btn-w\" data-wa=\"Здравствуйте! Интересует группа для детей 7–12.\" data-wa-kg=\"Саламатсызбы! 7–12 жаштагы балдар тобу кызыктырат.\" href=\"#\"><span data-kg=\"Тандоо\">Выбрать<\/span><\/a><\/div><\/div>\n      <div class=\"pr\" style=\"--c:var(--sky)\"><div class=\"top\"><h3 data-kg=\"Өспүрүмдөр 13–16\">Подростки 13–16<\/h3><div class=\"sum\">4 300 <small data-kg=\"сом\">сом<\/small><\/div><\/div><div class=\"bd\"><div><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Мектеп программасы + сүйлөшүү\">Школьная программа + разговор<\/span><\/div><div><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"ОРТ жана олимпиадага даярдык\">Подготовка к ОРТ и олимпиадам<\/span><\/div><a class=\"btn btn-w\" data-wa=\"Здравствуйте! Интересует группа для подростков.\" data-wa-kg=\"Саламатсызбы! Өспүрүмдөр тобу кызыктырат.\" href=\"#\"><span data-kg=\"Тандоо\">Выбрать<\/span><\/a><\/div><\/div>\n      <div class=\"pr\" style=\"--c:var(--violet)\"><div class=\"top\"><h3 data-kg=\"Чоңдор\">Взрослые<\/h3><div class=\"sum\">4 500 <small data-kg=\"сом\">сом<\/small><\/div><\/div><div class=\"bd\"><div><svg><use href=\"#i-check\"/><\/svg><span>Beginner → Advanced<\/span><\/div><div><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Жума сайын Speaking Club\">Speaking Club по пятницам<\/span><\/div><a class=\"btn btn-w\" data-wa=\"Здравствуйте! Интересует группа для взрослых.\" data-wa-kg=\"Саламатсызбы! Чоңдор тобу кызыктырат.\" href=\"#\"><span data-kg=\"Тандоо\">Выбрать<\/span><\/a><\/div><\/div>\n      <div class=\"pr\" style=\"--c:var(--mint)\"><div class=\"top\"><h3>IELTS<\/h3><div class=\"sum\">6 000 <small data-kg=\"сом\">сом<\/small><\/div><\/div><div class=\"bd\"><div><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Ай сайын пробный тест\">Пробный тест каждый месяц<\/span><\/div><div><svg><use href=\"#i-check\"/><\/svg><span data-kg=\"Максат — 7.0+\">Цель — 7.0+<\/span><\/div><a class=\"btn btn-w\" data-wa=\"Здравствуйте! Интересует подготовка к IELTS.\" data-wa-kg=\"Саламатсызбы! IELTS даярдоо кызыктырат.\" href=\"#\"><span data-kg=\"Тандоо\">Выбрать<\/span><\/a><\/div><\/div>\n    <\/div>\n    <div class=\"gift\"><b data-kg=\"Белек сертификат\">Подарочный сертификат<\/b><span data-kg=\"Жакын адамыңызга бир ай англис тилин белек кылыңыз — каалаган суммага.\">Подарите месяц английского близкому человеку — на любую сумму.<\/span><a class=\"btn btn-ink\" data-wa=\"Здравствуйте! Хочу купить подарочный сертификат.\" data-wa-kg=\"Саламатсызбы! Белек сертификат алгым келет.\" href=\"#\"><span data-kg=\"Сертификат алуу\">Купить сертификат<\/span><\/a><\/div>\n  <\/div>\n<\/section>\n\n<!-- Тест -->\n<section class=\"sec vio\" id=\"test\">\n  <div class=\"wrap test\">\n    <div>\n      <span class=\"badge\" style=\"color:var(--ink)\"><i style=\"background:var(--sun);color:var(--ink)\"><svg><use href=\"#i-q\"/><\/svg><\/i><span data-kg=\"10 суроо\">10 вопросов<\/span><\/span>\n      <h2 data-kg=\"Деңгээлиңизди текшериңиз\">Проверьте свой уровень<\/h2>\n      <p class=\"lead\" data-kg=\"2 мүнөт — деңгээл жана ылайыктуу топ. Жыйынтыкты бир баскыч менен жөнөтүңүз — биз чалабыз.\">2 минуты — и вы узнаете уровень и подходящую группу. Отправьте результат одной кнопкой — мы перезвоним.<\/p>\n      <div class=\"pts\"><span data-kg=\"Каттоосуз\">Без регистрации<\/span><span data-kg=\"Акысыз\">Бесплатно<\/span><span data-kg=\"Жыйынтык WhatsAppта\">Результат в WhatsApp<\/span><\/div>\n    <\/div>\n    <div id=\"qcard\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- Команда -->\n<section class=\"sec\" id=\"team\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"badge\"><i style=\"background:var(--sky)\"><svg><use href=\"#i-cap\"/><\/svg><\/i><span data-kg=\"Команда\">Команда<\/span><\/span><h2 data-kg=\"Сиздин мугалимдер\">Ваши преподаватели<\/h2><\/div><\/div>\n    <div class=\"team\">\n      <div class=\"tc\" style=\"--c:var(--coral)\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Айжан\">Айжан<\/b><span data-kg=\"Башкы мугалим, IELTS\">Head teacher, IELTS<\/span><em>IELTS 8.0<\/em><\/div><\/div>\n      <div class=\"tc\" style=\"--c:var(--violet)\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Тимур\">Тимур<\/b><span data-kg=\"Чоңдор, Speaking Club\">Взрослые, Speaking Club<\/span><em>CELTA<\/em><\/div><\/div>\n      <div class=\"tc\" style=\"--c:var(--sun)\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Мээрим\">Мээрим<\/b><span data-kg=\"Балдар, Kids Camp\">Дети, Kids Camp<\/span><em style=\"color:var(--ink)\">TKT<\/em><\/div><\/div>\n      <div class=\"tc\" style=\"--c:var(--mint)\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Дастан\">Дастан<\/b><span data-kg=\"Грамматика, Intermediate+\">Грамматика, Intermediate+<\/span><em>IELTS 7.5<\/em><\/div><\/div>\n      <div class=\"tc\" style=\"--c:var(--sky)\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div class=\"t\"><b data-kg=\"Камила\">Камила<\/b><span data-kg=\"Өспүрүмдөр, нөлдөн\">Подростки, с нуля<\/span><em>TESOL<\/em><\/div><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Отзывы -->\n<section class=\"sec lil\" id=\"reviews\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><div><span class=\"badge\"><i style=\"background:var(--sun);color:var(--ink)\"><svg><use href=\"#i-chat\"/><\/svg><\/i><span data-kg=\"Пикирлер\">Отзывы<\/span><\/span><h2 data-kg=\"Бизге жазышат\">Нам пишут<\/h2><\/div>\n      <div class=\"rate\"><b>4,9<\/b><div><div class=\"st\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/div><small data-kg=\"2ГИСте*\">в 2ГИС*<\/small><\/div><a class=\"btn btn-gis\" data-gis href=\"#\" style=\"padding:10px 14px;font-size:14px\"><svg><use href=\"#i-pin\"/><\/svg><span data-kg=\"Баары\">Все<\/span><\/a><\/div><\/div>\n    <div class=\"rv\">\n      <div class=\"msg\"><p data-kg=\"Биринчи жумада оозумду ачканга коркчумун. Бир айдан кийин мугалим менен англисче талашып жаттым!\">Первую неделю было страшно открыть рот. Через месяц я спорила с преподавателем по-английски!<\/p><div class=\"w\"><i>А<\/i><span>Алина<small>Intermediate<\/small><\/span><\/div><\/div>\n      <div class=\"msg\"><p data-kg=\"Уулум Kids Campтан кийин үйдө мультфильмдерди англисче гана көрөт.\">После Kids Camp сын дома смотрит мультики только на английском.<\/p><div class=\"w\"><i>Г<\/i><span data-kg=\"Гульнара<small>окуучунун апасы<\/small>\">Гульнара<small>мама ученика<\/small><\/span><\/div><\/div>\n      <div class=\"msg\"><p data-kg=\"IELTS — 7.0. Ай сайынкы пробный тесттер үчүн рахмат.\">IELTS — 7.0. Спасибо за пробные тесты каждый месяц.<\/p><div class=\"w\"><i>Б<\/i><span>Бекжан<small>IELTS<\/small><\/span><\/div><\/div>\n      <div class=\"msg\"><p data-kg=\"Биринчи жумада копилкага 200 сом бердим 😅 Азыр — нөл.\">За первую неделю отдал в копилку 200 сом 😅 Сейчас — ноль.<\ px);padding:14px 16px;text-align:left;font-family:inherit;font-weight:600;font-size:16px;line-height:1.2;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}\n.qt-opts button:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--qa,#6B2C91)}\n.qt-opts button.ok{background:#1FA36B;color:#fff}\n.qt-opts button.no{background:#E5484D;color:#fff}\n.qt-opts button:disabled{cursor:default}\n.qt-lvl{font-family:var(--qh,inherit);font-weight:700;font-size:clamp(30px,3.6vw,42px);line-height:1.05;color:var(--qa,#6B2C91);margin:6px 0 8px}\n.qt-dots{display:flex;gap:4px;margin:2px 0 12px}\n.qt-dots i{width:16px;height:8px;border-radius:4px;background:#E5484D;opacity:.75}\n.qt-dots i.ok{background:#1FA36B;opacity:1}\n.qt-res p{margin:0 0 14px}\n.qt-next{background:var(--qnext,rgba(127,127,127,.1));border-radius:var(--qr,16px);padding:14px 16px}\n.qt-next b{display:block;margin-bottom:10px}\n.qt-btns{display:flex;gap:8px;flex-wrap:wrap}\n.qt-btns a,.qt-btns button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--qr,16px);padding:12px 16px;font-family:inherit;font-weight:700;font-size:15px;line-height:1;text-decoration:none;cursor:pointer;white-space:nowrap}\n.qt-btns svg{width:18px;height:18px}\n.qt-wa{background:#25D366;color:#fff}\n.qt-call{background:var(--qcall,var(--qa,#6B2C91));color:var(--qcallfg,#fff)}\n.qt-btns .qt-again{background:none;color:inherit;text-decoration:underline;opacity:.75;padding:12px 6px}\n@media (max-width:760px){.qt-opts{grid-template-columns:1fr}.qt-btns a{flex:1}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}\n<\/style>\n<nav class=\"mbar\" aria-label=\"Быстрая связь\">\n  <a href=\"tel:+996770692299\"><svg><use href=\"#i-phone\"/><\/svg><span data-kg=\"Чалуу\">Позвонить<\/span><\/a>\n  <a class=\"wa\" data-wa href=\"https://wa.me/996
